name: Pages

# Сайт на GitHub Pages: только docs/site/public. Маскот из docs/images кладётся
# рядом со страницами, ссылки за пределы сайта ведут в репозиторий, главная —
# LANDING.html под именем index.html.

on:
  push:
    branches:
      - master
    paths:
      - "docs/site/public/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public pages
        run: |
          cp -r docs/site/public _site
          mkdir -p _site/images
          cp docs/images/mascot.jpg _site/images/
          blob="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs"
          find _site -name '*.html' -exec sed -i \
            -e 's#\.\./\.\./images/#images/#g' \
            -e "s#href=\"\.\./\.\./#href=\"${blob}/#g" {} +
          cp _site/LANDING.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
