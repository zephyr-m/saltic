name: Release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: read

jobs:
  notify-start:
    name: Notify start
    runs-on: ubuntu-latest
    steps:
      - name: Tell Telegram the release started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          token="$(tr -d '[:space:]' <<< "${TELEGRAM_BOT_TOKEN}")"
          chat="$(tr -d '[:space:]' <<< "${TELEGRAM_CHAT_ID}")"
          if [[ -z "${token}" || -z "${chat}" ]]; then
            echo "Telegram: секретов нет, пропускаю"
            exit 0
          fi
          curl -sS -m 20 \
            "https://api.telegram.org/bot${token}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text=🕷 Saltic ${GITHUB_REF_NAME}: релиз пошёл
          ${RUN_URL}" | grep -o '"ok":[a-z]*\|"description":"[^"]*"' || true

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          test "${tag}" = "v${version//:/.}"
          git cat-file -e "${tag}^{tag}"
          grep -q "^## ${version} — " CHANGELOG.md

      - name: Espressif Xtensa toolchain — GNU as for the esp32 branch (no board in CI)
        run: >-
          mkdir -p ~/tools/xtensa
          && curl -sSfL https://github.com/espressif/crosstool-NG/releases/download/esp-16.1.0_20260609/xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.gz
          | tar -xz -C ~/tools/xtensa

      - name: Global check — self-build, every test, host and platform at once
        run: >-
          mkdir -p .cache/build/workbench
          && bootstrap/saltic workbench/check/global-check.saltic .cache/build/workbench/global-check 536870912 x86_64
          && chmod +x .cache/build/workbench/global-check
          && .cache/build/workbench/global-check

      - name: Check the committed compiler is the fixed point
        # сверяются сами компиляторы; паспорта (.txt) меняет самосборка на RV64 —
        # время и процессор машины CI, байты компилятора от этого не зависят
        run: |
          git status --porcelain -- bootstrap/
          test -z "$(git status --porcelain -- bootstrap/ | grep -v '\.txt$' || true)"

  arm64-compiler:
    name: ARM64 compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Build the ARM64 compiler with the shelf compiler
        run: >-
          mkdir -p .cache/arm64
          && bootstrap/saltic soul/seed/selfhost/toolchain.saltic .cache/arm64/saltic 536870912 arm64

      - name: Hand the compiler to the ARM64 runner
        uses: actions/upload-artifact@v4.6.2
        with:
          name: saltic-arm64
          path: .cache/arm64/saltic

  arm64:
    name: ARM64 native
    needs: arm64-compiler
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Take the ARM64 compiler
        uses: actions/download-artifact@v4.3.0
        with:
          name: saltic-arm64
          path: .cache/arm64

      - name: Canon, edges and self-build on a real ARM64
        # без эмулятора: канон и граничные случаи — те же эталоны, что у всех целей;
        # компилятор собирает сам себя под ARM64 — байты те же, что у собранного на x86-64
        shell: bash
        run: |
          set -euo pipefail
          work=.cache/arm64
          saltic="${work}/saltic"
          chmod +x "${saltic}"
          "${saltic}" soul/canonical/main.saltic "${work}/canonical" 67108864 arm64
          cp tests/fixtures/input.txt "${work}/input.txt"
          "${work}/canonical" "${work}/input.txt" "${work}/output.txt" > "${work}/stdout.txt"
          cmp soul/canonical/expected/output.txt "${work}/stdout.txt"
          test "$(tr -d '[:space:]' < "${work}/output.txt")" = "pip:0"
          "${saltic}" soul/canonical/edges.saltic "${work}/edges" 536870912 arm64
          "${work}/edges" > "${work}/edges.txt"
          cmp soul/canonical/expected/edges.txt "${work}/edges.txt"
          "${saltic}" soul/seed/selfhost/toolchain.saltic "${work}/saltic-again" 536870912 arm64
          cmp "${saltic}" "${work}/saltic-again"

  publish:
    name: Publish
    needs: [verify, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME}"

          if [[ ! "${version}" =~ ^[0-9]+:[0-9]+(:[0-9]+)?$ ]]; then
            echo "VERSION ${version} is not a Football score F:B or F:B:C" >&2
            exit 1
          fi

          if [[ "${tag}" != "v${version//:/.}" ]]; then
            echo "tag ${tag} does not match VERSION ${version}" >&2
            exit 1
          fi

          if ! git cat-file -e "${tag}^{tag}" 2>/dev/null; then
            echo "tag ${tag} must be annotated" >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v version="${version}" '
            index($0, "## " version " — ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "${notes}"

          if [[ ! -s "${notes}" ]]; then
            echo "CHANGELOG has no notes for ${version}" >&2
            exit 1
          fi

          title="$(git for-each-ref "refs/tags/${tag}" --format='%(contents:subject)')"
          if [[ -z "${title}" ]]; then
            title="Saltic ${version}"
          fi

          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"
          echo "version=${version//:/-}" >> "${GITHUB_OUTPUT}"

      - name: Build clean SDK archive
        run: bash .github/package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SALTIC_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          ".cache/dist/saltic-${SALTIC_RELEASE_VERSION}.tar.gz"
          ".cache/dist/saltic-${SALTIC_RELEASE_VERSION}.tar.gz.sha256"
          --verify-tag
          --title "${{ steps.release.outputs.title }}"
          --notes-file "${{ steps.release.outputs.notes }}"

  notify-finish:
    name: Notify finish
    needs: [verify, arm64, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tell Telegram how the release ended
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY: ${{ needs.verify.result }}
          ARM64: ${{ needs.arm64.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          token="$(tr -d '[:space:]' <<< "${TELEGRAM_BOT_TOKEN}")"
          chat="$(tr -d '[:space:]' <<< "${TELEGRAM_CHAT_ID}")"
          if [[ -z "${token}" || -z "${chat}" ]]; then
            echo "Telegram: секретов нет, пропускаю"
            exit 0
          fi
          if [[ "${PUBLISH}" == "success" ]]; then
            status="✅ опубликован"
          elif [[ "${VERIFY}" != "success" ]]; then
            status="❌ проверка: ${VERIFY}"
          elif [[ "${ARM64}" != "success" ]]; then
            status="❌ arm64: ${ARM64}"
          else
            status="❌ публикация: ${PUBLISH}"
          fi
          curl -sS -m 20 \
            "https://api.telegram.org/bot${token}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text=🕷 Saltic ${GITHUB_REF_NAME}: ${status}
          ${RUN_URL}" | grep -o '"ok":[a-z]*\|"description":"[^"]*"' || true
