name: Release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: read

jobs:
  notify-start:
    name: Notify start
    runs-on: ubuntu-latest
    steps:
      - name: Tell Telegram the release started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          token="$(tr -d '[:space:]' <<< "${TELEGRAM_BOT_TOKEN}")"
          chat="$(tr -d '[:space:]' <<< "${TELEGRAM_CHAT_ID}")"
          if [[ -z "${token}" || -z "${chat}" ]]; then
            echo "Telegram: секретов нет, пропускаю"
            exit 0
          fi
          curl -sS -m 20 \
            "https://api.telegram.org/bot${token}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text=🕷 Saltic ${GITHUB_REF_NAME}: релиз пошёл
          ${RUN_URL}" | grep -o '"ok":[a-z]*\|"description":"[^"]*"' || true

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          test "${tag}" = "v${version//:/.}"
          git cat-file -e "${tag}^{tag}"
          grep -q "^## ${version} — " CHANGELOG.md

      - name: Global check — self-build, every test, host and platform at once
        run: >-
          mkdir -p .cache/build/workbench
          && bootstrap/saltic workbench/global-check.saltic .cache/build/workbench/global-check 536870912 x86_64
          && chmod +x .cache/build/workbench/global-check
          && .cache/build/workbench/global-check

      - name: Check the committed compiler is the fixed point
        # сверяются сами компиляторы; паспорта (.txt) меняет самосборка на RV64 —
        # время и процессор машины CI, байты компилятора от этого не зависят
        run: |
          git status --porcelain -- bootstrap/
          test -z "$(git status --porcelain -- bootstrap/ | grep -v '\.txt$' || true)"

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME}"

          if [[ ! "${version}" =~ ^[0-9]+:[0-9]+(:[0-9]+)?$ ]]; then
            echo "VERSION ${version} is not a Football score F:B or F:B:C" >&2
            exit 1
          fi

          if [[ "${tag}" != "v${version//:/.}" ]]; then
            echo "tag ${tag} does not match VERSION ${version}" >&2
            exit 1
          fi

          if ! git cat-file -e "${tag}^{tag}" 2>/dev/null; then
            echo "tag ${tag} must be annotated" >&2
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v version="${version}" '
            index($0, "## " version " — ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "${notes}"

          if [[ ! -s "${notes}" ]]; then
            echo "CHANGELOG has no notes for ${version}" >&2
            exit 1
          fi

          title="$(git for-each-ref "refs/tags/${tag}" --format='%(contents:subject)')"
          if [[ -z "${title}" ]]; then
            title="Saltic ${version}"
          fi

          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          echo "notes=${notes}" >> "${GITHUB_OUTPUT}"
          echo "version=${version//:/-}" >> "${GITHUB_OUTPUT}"

      - name: Build clean SDK archive
        run: bash .github/package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SALTIC_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          ".cache/dist/saltic-${SALTIC_RELEASE_VERSION}.tar.gz"
          ".cache/dist/saltic-${SALTIC_RELEASE_VERSION}.tar.gz.sha256"
          --verify-tag
          --title "${{ steps.release.outputs.title }}"
          --notes-file "${{ steps.release.outputs.notes }}"

  notify-finish:
    name: Notify finish
    needs: [verify, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tell Telegram how the release ended
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY: ${{ needs.verify.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          token="$(tr -d '[:space:]' <<< "${TELEGRAM_BOT_TOKEN}")"
          chat="$(tr -d '[:space:]' <<< "${TELEGRAM_CHAT_ID}")"
          if [[ -z "${token}" || -z "${chat}" ]]; then
            echo "Telegram: секретов нет, пропускаю"
            exit 0
          fi
          if [[ "${PUBLISH}" == "success" ]]; then
            status="✅ опубликован"
          elif [[ "${VERIFY}" != "success" ]]; then
            status="❌ проверка: ${VERIFY}"
          else
            status="❌ публикация: ${PUBLISH}"
          fi
          curl -sS -m 20 \
            "https://api.telegram.org/bot${token}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text=🕷 Saltic ${GITHUB_REF_NAME}: ${status}
          ${RUN_URL}" | grep -o '"ok":[a-z]*\|"description":"[^"]*"' || true
