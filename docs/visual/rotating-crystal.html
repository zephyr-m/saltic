<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S visual sketch - rotating crystal</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #07090d;
      color: #e8edf2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background:
        radial-gradient(circle at 50% 45%, rgba(84, 180, 255, 0.18), transparent 32%),
        linear-gradient(180deg, #0c1118 0%, #07090d 70%);
    }

    .label {
      position: fixed;
      left: 24px;
      bottom: 22px;
      display: grid;
      gap: 4px;
      color: rgba(232, 237, 242, 0.78);
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
    }

    .label strong {
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Rotating crystal visual sketch"></canvas>
  <div class="label">
    <strong>S visual sketch</strong>
    <span>rotating crystal / first render feeling</span>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    const topPoint = [0, -2.25, 0];
    const upper = [
      [-0.9, -0.75, -0.9],
      [0.9, -0.75, -0.9],
      [1.1, -0.75, 0.85],
      [-1.1, -0.75, 0.85],
    ];
    const lower = [
      [-0.62, 0.85, -0.62],
      [0.62, 0.85, -0.62],
      [0.76, 0.85, 0.58],
      [-0.76, 0.85, 0.58],
    ];
    const bottom = [0, 2.05, 0];

    const faces = [
      [topPoint, upper[0], upper[1], "rgba(150, 226, 255, 0.78)"],
      [topPoint, upper[1], upper[2], "rgba(89, 194, 255, 0.70)"],
      [topPoint, upper[2], upper[3], "rgba(66, 165, 225, 0.62)"],
      [topPoint, upper[3], upper[0], "rgba(194, 246, 255, 0.72)"],
      [upper[0], lower[0], lower[1], upper[1], "rgba(92, 202, 255, 0.56)"],
      [upper[1], lower[1], lower[2], upper[2], "rgba(54, 145, 218, 0.56)"],
      [upper[2], lower[2], lower[3], upper[3], "rgba(34, 110, 188, 0.52)"],
      [upper[3], lower[3], lower[0], upper[0], "rgba(142, 230, 255, 0.58)"],
      [bottom, lower[1], lower[0], "rgba(100, 210, 255, 0.50)"],
      [bottom, lower[2], lower[1], "rgba(49, 141, 214, 0.50)"],
      [bottom, lower[3], lower[2], "rgba(32, 100, 176, 0.48)"],
      [bottom, lower[0], lower[3], "rgba(160, 238, 255, 0.50)"],
    ];

    const edges = [
      [topPoint, upper[0]], [topPoint, upper[1]], [topPoint, upper[2]], [topPoint, upper[3]],
      [upper[0], upper[1]], [upper[1], upper[2]], [upper[2], upper[3]], [upper[3], upper[0]],
      [upper[0], lower[0]], [upper[1], lower[1]], [upper[2], lower[2]], [upper[3], lower[3]],
      [lower[0], lower[1]], [lower[1], lower[2]], [lower[2], lower[3]], [lower[3], lower[0]],
      [bottom, lower[0]], [bottom, lower[1]], [bottom, lower[2]], [bottom, lower[3]],
    ];

    const stars = Array.from({ length: 90 }, (_, index) => ({
      x: (Math.sin(index * 91.7) * 0.5 + 0.5),
      y: (Math.cos(index * 37.3) * 0.5 + 0.5),
      r: 0.45 + ((index * 17) % 11) / 12,
      a: 0.25 + ((index * 29) % 10) / 20,
    }));

    function resize() {
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function rotate(point, time) {
      const [x, y, z] = point;
      const ay = time * 0.00058;
      const ax = Math.sin(time * 0.00031) * 0.16 - 0.08;
      const cy = Math.cos(ay);
      const sy = Math.sin(ay);
      const cx = Math.cos(ax);
      const sx = Math.sin(ax);

      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      const y1 = y * cx - z1 * sx;
      const z2 = y * sx + z1 * cx;
      return [x1, y1, z2];
    }

    function project(point, width, height) {
      const distance = 6.2;
      const scale = Math.min(width, height) * 0.145;
      const perspective = distance / (distance + point[2]);
      return {
        x: width * 0.5 + point[0] * scale * perspective,
        y: height * 0.48 + point[1] * scale * perspective,
        z: point[2],
      };
    }

    function drawFace(face, time, width, height) {
      const color = face[face.length - 1];
      const points = face.slice(0, -1).map((point) => project(rotate(point, time), width, height));
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "rgba(232, 252, 255, 0.28)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function draw(time) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      ctx.clearRect(0, 0, width, height);

      for (const star of stars) {
        const pulse = 0.55 + Math.sin(time * 0.0012 + star.x * 18) * 0.28;
        ctx.beginPath();
        ctx.arc(star.x * width, star.y * height, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 244, 255, ${star.a * pulse})`;
        ctx.fill();
      }

      const glow = ctx.createRadialGradient(width * 0.5, height * 0.48, 10, width * 0.5, height * 0.48, Math.min(width, height) * 0.34);
      glow.addColorStop(0, "rgba(120, 220, 255, 0.22)");
      glow.addColorStop(1, "rgba(120, 220, 255, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      const sorted = faces.slice().sort((a, b) => {
        const az = a.slice(0, -1).reduce((sum, p) => sum + rotate(p, time)[2], 0) / (a.length - 1);
        const bz = b.slice(0, -1).reduce((sum, p) => sum + rotate(p, time)[2], 0) / (b.length - 1);
        return bz - az;
      });

      ctx.save();
      ctx.shadowColor = "rgba(83, 205, 255, 0.62)";
      ctx.shadowBlur = 30;
      for (const face of sorted) drawFace(face, time, width, height);
      ctx.restore();

      ctx.strokeStyle = "rgba(236, 254, 255, 0.55)";
      ctx.lineWidth = 1.2;
      for (const [a, b] of edges) {
        const pa = project(rotate(a, time), width, height);
        const pb = project(rotate(b, time), width, height);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
