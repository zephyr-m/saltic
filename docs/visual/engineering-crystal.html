<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S engineering crystal</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f3f5f2;
      color: #1c2326;
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    body {
      overflow: hidden;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background:
        linear-gradient(rgba(31, 128, 112, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 128, 112, 0.08) 1px, transparent 1px),
        linear-gradient(#f8faf7, #edf2ef);
      background-size: 24px 24px, 24px 24px, auto;
    }

    .caption {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(28, 35, 38, 0.72);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }

    .caption strong {
      display: block;
      color: rgba(28, 35, 38, 0.92);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Engineering paper rotating crystal"></canvas>
  <div class="caption">
    <strong>S / crystal primitive</strong>
    two triangular pyramids / engineering paper / rotating observation
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    const topPoint = [0, -2.25, 0];
    const centerA = [-0.9, 0, -0.9];
    const centerB = [0.9, 0, -0.9];
    const centerC = [0.9, 0, 0.9];
    const centerD = [-0.9, 0, 0.9];
    const bottomPoint = [0, 2.25, 0];

    const faces = [
      [topPoint, centerA, centerB],
      [topPoint, centerB, centerC],
      [topPoint, centerC, centerD],
      [topPoint, centerD, centerA],
      [bottomPoint, centerB, centerA],
      [bottomPoint, centerC, centerB],
      [bottomPoint, centerD, centerC],
      [bottomPoint, centerA, centerD],
    ];

    const edges = [
      [topPoint, centerA],
      [topPoint, centerB],
      [topPoint, centerC],
      [topPoint, centerD],
      [bottomPoint, centerA],
      [bottomPoint, centerB],
      [bottomPoint, centerC],
      [bottomPoint, centerD],
      [centerA, centerB],
      [centerB, centerC],
      [centerC, centerD],
      [centerD, centerA],
    ];

    function resize() {
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function rotate(point, time) {
      const [x, y, z] = point;
      const ay = time * 0.00042;
      const ax = -0.18 + Math.sin(time * 0.00025) * 0.05;
      const cy = Math.cos(ay);
      const sy = Math.sin(ay);
      const cx = Math.cos(ax);
      const sx = Math.sin(ax);
      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      const y1 = y * cx - z1 * sx;
      const z2 = y * sx + z1 * cx;
      return [x1, y1, z2];
    }

    function project(point, width, height) {
      const scale = Math.min(width, height) * 0.16;
      return {
        x: width * 0.5 + point[0] * scale,
        y: height * 0.48 + point[1] * scale,
        z: point[2],
      };
    }

    function faceDepth(face, time) {
      return face.reduce((sum, point) => sum + rotate(point, time)[2], 0) / face.length;
    }

    function drawAxes(width, height) {
      const originX = width * 0.5;
      const originY = height * 0.48;
      ctx.save();
      ctx.strokeStyle = "rgba(35, 84, 78, 0.18)";
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(originX - 220, originY);
      ctx.lineTo(originX + 220, originY);
      ctx.moveTo(originX, originY - 250);
      ctx.lineTo(originX, originY + 250);
      ctx.stroke();
      ctx.restore();
    }

    function drawFace(face, time, width, height, index) {
      const points = face.map((point) => project(rotate(point, time), width, height));
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      ctx.lineTo(points[1].x, points[1].y);
      ctx.lineTo(points[2].x, points[2].y);
      ctx.closePath();
      ctx.fillStyle = index % 2 === 0 ? "rgba(0, 184, 218, 0.13)" : "rgba(0, 126, 178, 0.10)";
      ctx.fill();
      ctx.strokeStyle = "rgba(0, 134, 160, 0.32)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawEdge(edge, time, width, height) {
      const a = project(rotate(edge[0], time), width, height);
      const b = project(rotate(edge[1], time), width, height);
      const depth = (a.z + b.z) / 2;
      const alpha = depth > 0 ? 0.78 : 0.34;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `rgba(0, 129, 156, ${alpha})`;
      ctx.lineWidth = depth > 0 ? 1.6 : 1;
      ctx.stroke();
    }

    function drawVertex(point, time, width, height, label) {
      const p = project(rotate(point, time), width, height);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 132, 156, 0.88)";
      ctx.fill();
      ctx.fillStyle = "rgba(28, 35, 38, 0.62)";
      ctx.font = "12px ui-monospace, monospace";
      ctx.fillText(label, p.x + 8, p.y - 8);
    }

    function draw(time) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      ctx.clearRect(0, 0, width, height);
      drawAxes(width, height);

      const sortedFaces = faces
        .map((face, index) => ({ face, index }))
        .sort((a, b) => faceDepth(a.face, time) - faceDepth(b.face, time));
      for (const item of sortedFaces) drawFace(item.face, time, width, height, item.index);

      for (const edge of edges) drawEdge(edge, time, width, height);

      drawVertex(topPoint, time, width, height, "A");
      drawVertex(centerA, time, width, height, "B");
      drawVertex(centerB, time, width, height, "C");
      drawVertex(centerC, time, width, height, "D");
      drawVertex(centerD, time, width, height, "E");
      drawVertex(bottomPoint, time, width, height, "F");

      ctx.fillStyle = "rgba(28, 35, 38, 0.62)";
      ctx.font = "12px ui-monospace, monospace";
      ctx.fillText("primitive: bipyramid", width * 0.5 - 88, height * 0.48 + Math.min(width, height) * 0.43);

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
