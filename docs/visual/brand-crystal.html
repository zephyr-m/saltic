<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S brand crystal</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020406;
      color: #eaf6f8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background:
        radial-gradient(circle at 50% 80%, rgba(0, 210, 255, 0.20), transparent 20%),
        radial-gradient(circle at 50% 43%, rgba(0, 190, 255, 0.12), transparent 26%),
        linear-gradient(180deg, #03070a 0%, #020406 100%);
    }

    .mark {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(234, 246, 248, 0.74);
      font-size: 12px;
      letter-spacing: 0;
      pointer-events: none;
    }

    .mark strong {
      display: block;
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Rotating S brand crystal"></canvas>
  <div class="mark">
    <strong>S crystal study</strong>
    cyan glass / S-green pulse / rotating state
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    const apexTop = [0, -3.35, 0];
    const crown = [
      [-0.48, -1.62, -0.58],
      [0.56, -1.62, -0.52],
      [0.84, -1.62, 0.34],
      [0.18, -1.62, 0.82],
      [-0.72, -1.62, 0.42],
    ];
    const shoulder = [
      [-1.22, -0.42, -0.82],
      [1.18, -0.42, -0.74],
      [1.44, -0.42, 0.66],
      [0.36, -0.42, 1.16],
      [-1.36, -0.42, 0.76],
    ];
    const waist = [
      [-0.88, 1.24, -0.62],
      [0.92, 1.24, -0.56],
      [1.05, 1.24, 0.48],
      [0.24, 1.24, 0.82],
      [-1.04, 1.24, 0.54],
    ];
    const apexBottom = [0, 3.15, 0];
    const coreTop = [0.04, -2.15, 0.05];
    const coreMid = [0.12, -0.12, 0.18];
    const coreLow = [-0.04, 1.78, 0.08];

    const faces = [
      [apexTop, crown[0], crown[1], "rgba(214, 253, 255, 0.72)", 1.12],
      [apexTop, crown[1], crown[2], "rgba(78, 221, 255, 0.62)", 0.94],
      [apexTop, crown[2], crown[3], "rgba(20, 120, 190, 0.56)", 0.72],
      [apexTop, crown[3], crown[4], "rgba(8, 56, 105, 0.58)", 0.52],
      [apexTop, crown[4], crown[0], "rgba(120, 238, 255, 0.66)", 0.92],

      [crown[0], shoulder[0], shoulder[1], crown[1], "rgba(14, 65, 122, 0.64)", 0.44],
      [crown[1], shoulder[1], shoulder[2], crown[2], "rgba(22, 196, 236, 0.58)", 0.82],
      [crown[2], shoulder[2], shoulder[3], crown[3], "rgba(9, 42, 90, 0.66)", 0.36],
      [crown[3], shoulder[3], shoulder[4], crown[4], "rgba(2, 21, 54, 0.72)", 0.26],
      [crown[4], shoulder[4], shoulder[0], crown[0], "rgba(30, 178, 232, 0.58)", 0.70],

      [shoulder[0], waist[0], waist[1], shoulder[1], "rgba(4, 25, 64, 0.74)", 0.28],
      [shoulder[1], waist[1], waist[2], shoulder[2], "rgba(54, 224, 255, 0.54)", 0.86],
      [shoulder[2], waist[2], waist[3], shoulder[3], "rgba(6, 40, 90, 0.72)", 0.34],
      [shoulder[3], waist[3], waist[4], shoulder[4], "rgba(0, 15, 42, 0.76)", 0.20],
      [shoulder[4], waist[4], waist[0], shoulder[0], "rgba(16, 168, 226, 0.54)", 0.74],

      [apexBottom, waist[1], waist[0], "rgba(77, 230, 255, 0.50)", 0.78],
      [apexBottom, waist[2], waist[1], "rgba(10, 88, 157, 0.58)", 0.44],
      [apexBottom, waist[3], waist[2], "rgba(4, 35, 88, 0.60)", 0.28],
      [apexBottom, waist[4], waist[3], "rgba(2, 20, 58, 0.64)", 0.18],
      [apexBottom, waist[0], waist[4], "rgba(32, 195, 238, 0.48)", 0.70],
    ];

    const brightEdges = [
      [apexTop, crown[0]], [apexTop, crown[1]], [apexTop, crown[2]], [apexTop, crown[4]],
      [crown[1], shoulder[1]], [crown[2], shoulder[2]], [shoulder[1], waist[1]],
      [shoulder[2], waist[2]], [waist[1], apexBottom], [waist[0], apexBottom],
      [coreTop, coreMid], [coreMid, coreLow],
    ];

    const allEdges = [
      ...brightEdges,
      [apexTop, crown[3]], [crown[0], crown[1]], [crown[1], crown[2]], [crown[2], crown[3]],
      [crown[3], crown[4]], [crown[4], crown[0]], [shoulder[0], shoulder[1]],
      [shoulder[1], shoulder[2]], [shoulder[2], shoulder[3]], [shoulder[3], shoulder[4]],
      [shoulder[4], shoulder[0]], [waist[0], waist[1]], [waist[1], waist[2]],
      [waist[2], waist[3]], [waist[3], waist[4]], [waist[4], waist[0]],
      [waist[2], apexBottom], [waist[3], apexBottom], [waist[4], apexBottom],
    ];

    const shards = [
      [shoulder[1], coreMid, waist[2], "rgba(120, 255, 255, 0.34)"],
      [crown[2], coreTop, coreMid, "rgba(190, 255, 255, 0.24)"],
      [shoulder[4], coreMid, waist[0], "rgba(0, 210, 255, 0.18)"],
      [coreMid, waist[1], apexBottom, "rgba(178, 255, 244, 0.18)"],
    ];

    const stars = Array.from({ length: 120 }, (_, index) => ({
      x: Math.sin(index * 73.113) * 0.5 + 0.5,
      y: Math.cos(index * 41.721) * 0.5 + 0.5,
      r: 0.25 + ((index * 7) % 10) / 10,
      a: 0.12 + ((index * 19) % 12) / 32,
    }));

    function resize() {
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function rotate(point, time) {
      const [x, y, z] = point;
      const ay = time * 0.00043;
      const ax = Math.sin(time * 0.00022) * 0.12 - 0.02;
      const az = Math.sin(time * 0.00017) * 0.035;
      const cy = Math.cos(ay);
      const sy = Math.sin(ay);
      const cx = Math.cos(ax);
      const sx = Math.sin(ax);
      const cz = Math.cos(az);
      const sz = Math.sin(az);

      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      const y1 = y * cx - z1 * sx;
      const z2 = y * sx + z1 * cx;
      const x2 = x1 * cz - y1 * sz;
      const y2 = x1 * sz + y1 * cz;
      return [x2, y2, z2];
    }

    function project(point, width, height) {
      const distance = 7.4;
      const scale = Math.min(width, height) * 0.137;
      const perspective = distance / (distance + point[2]);
      return {
        x: width * 0.5 + point[0] * scale * perspective,
        y: height * 0.47 + point[1] * scale * perspective,
        z: point[2],
      };
    }

    function depthOf(poly, time) {
      const points = poly.slice(0, -2);
      return points.reduce((sum, point) => sum + rotate(point, time)[2], 0) / points.length;
    }

    function drawPoly(poly, time, width, height) {
      const color = poly[poly.length - 2];
      const light = poly[poly.length - 1];
      const points = poly.slice(0, -2).map((point) => project(rotate(point, time), width, height));
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.closePath();

      const gradient = ctx.createLinearGradient(points[0].x, points[0].y, points[Math.floor(points.length / 2)].x, points[Math.floor(points.length / 2)].y);
      gradient.addColorStop(0, color);
      gradient.addColorStop(0.48, `rgba(${Math.floor(40 + light * 150)}, ${Math.floor(105 + light * 120)}, ${Math.floor(145 + light * 95)}, ${0.35 + light * 0.32})`);
      gradient.addColorStop(1, "rgba(0, 10, 28, 0.62)");
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = `rgba(220, 253, 255, ${0.08 + light * 0.20})`;
      ctx.lineWidth = 0.85;
      ctx.stroke();
    }

    function drawShard(poly, time, width, height) {
      const color = poly[poly.length - 1];
      const points = poly.slice(0, -1).map((point) => project(rotate(point, time), width, height));
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawEdge(edge, time, width, height, bright) {
      const [a, b] = edge;
      const pa = project(rotate(a, time), width, height);
      const pb = project(rotate(b, time), width, height);
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = bright ? "rgba(230, 255, 255, 0.72)" : "rgba(172, 242, 255, 0.22)";
      ctx.lineWidth = bright ? 1.4 : 0.9;
      ctx.stroke();
    }

    function draw(time) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      ctx.clearRect(0, 0, width, height);

      for (const star of stars) {
        const pulse = 0.58 + Math.sin(time * 0.001 + star.x * 23) * 0.28;
        ctx.beginPath();
        ctx.arc(star.x * width, star.y * height, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210, 248, 255, ${star.a * pulse})`;
        ctx.fill();
      }

      const floorGlow = ctx.createRadialGradient(width * 0.5, height * 0.82, 4, width * 0.5, height * 0.82, Math.min(width, height) * 0.34);
      floorGlow.addColorStop(0, "rgba(0, 242, 255, 0.42)");
      floorGlow.addColorStop(0.34, "rgba(0, 180, 255, 0.16)");
      floorGlow.addColorStop(1, "rgba(0, 180, 255, 0)");
      ctx.fillStyle = floorGlow;
      ctx.fillRect(0, 0, width, height);

      const aura = ctx.createRadialGradient(width * 0.5, height * 0.48, 10, width * 0.5, height * 0.48, Math.min(width, height) * 0.38);
      aura.addColorStop(0, "rgba(0, 218, 255, 0.22)");
      aura.addColorStop(0.44, "rgba(94, 255, 205, 0.08)");
      aura.addColorStop(1, "rgba(0, 218, 255, 0)");
      ctx.fillStyle = aura;
      ctx.fillRect(0, 0, width, height);

      const pulse = 0.5 + Math.sin(time * 0.0022) * 0.5;
      const sGlow = ctx.createRadialGradient(width * 0.5, height * 0.50, 4, width * 0.5, height * 0.50, Math.min(width, height) * 0.20);
      sGlow.addColorStop(0, `rgba(135, 255, 32, ${0.08 + pulse * 0.11})`);
      sGlow.addColorStop(1, "rgba(135, 255, 32, 0)");
      ctx.fillStyle = sGlow;
      ctx.fillRect(0, 0, width, height);

      const sorted = faces.slice().sort((a, b) => depthOf(b, time) - depthOf(a, time));

      ctx.save();
      ctx.shadowColor = "rgba(0, 214, 255, 0.58)";
      ctx.shadowBlur = 34;
      for (const face of sorted) drawPoly(face, time, width, height);
      ctx.restore();

      for (const shard of shards) drawShard(shard, time, width, height);

      for (const edge of allEdges) {
        drawEdge(edge, time, width, height, brightEdges.includes(edge));
      }

      const beamX = width * 0.5 + Math.sin(time * 0.00043) * Math.min(width, height) * 0.012;
      const beam = ctx.createLinearGradient(beamX, height * 0.14, beamX, height * 0.83);
      beam.addColorStop(0, "rgba(255, 255, 255, 0)");
      beam.addColorStop(0.38, "rgba(225, 255, 255, 0.16)");
      beam.addColorStop(0.76, "rgba(0, 245, 255, 0.25)");
      beam.addColorStop(1, "rgba(0, 245, 255, 0)");
      ctx.strokeStyle = beam;
      ctx.lineWidth = Math.max(1, Math.min(width, height) * 0.012);
      ctx.beginPath();
      ctx.moveTo(beamX, height * 0.16);
      ctx.lineTo(beamX, height * 0.82);
      ctx.stroke();

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
