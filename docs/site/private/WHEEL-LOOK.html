<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо: язык вида</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500;700&family=Onest:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Проба языка вида для колеса: два настроения — «Холод» (чистые линии, покой) и «Броня» (HUD, движение).
   Данные — настоящие, из WHEEL.html. Всё движение — пружины: прерывается и меняет направление без рывков. */
:root {
  --bg: #04070b; --ink: #e8f1fb; --muted: #7d8da1; --line: rgba(190, 220, 255, .16);
  --glow: #bfe3ff; --accent: #9fd4ff; --hot: #ffffff; --card: rgba(8, 14, 22, .82);
  --mono: "JetBrains Mono", ui-monospace, monospace; --display: "Exo 2", system-ui, sans-serif;
}
body[data-mood="armor"] {
  --bg: #010608; --ink: #dffcff; --muted: #4fa3b3; --line: rgba(0, 240, 255, .22);
  --glow: #00f0ff; --accent: #00e1ff; --hot: #ff5a36; --card: rgba(0, 18, 24, .78);
}
/* «Мягкая броня» (пульт): скелет и движение брони, кожа «Организма» — Onest, графит, цвет по смыслу. */
body[data-mood="soft"], body[data-mood="soft"].readable {
  --bg: #07090d; --ink: #eef1f6; --muted: #8b94a4; --line: rgba(139, 148, 164, .24);
  --glow: #46c8ff; --accent: #46c8ff; --hot: #ff5a6e; --card: rgba(18, 23, 34, .92); --display: "Onest", system-ui, sans-serif;
}
body.embed[data-mood="soft"] { background: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden;
  transition: background .6s; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(circle at 50% 50%, #000 0, transparent 70%); }
body[data-mood="armor"]::after { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 240, 255, .035) 0 1px, transparent 1px 3px); }
.bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)); z-index: 3; font: 400 11px var(--mono); color: var(--muted); letter-spacing: .14em; }
.bar h1 { margin: 0; font: 300 18px var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }
.moods { display: flex; gap: 6px; }
.moods button { font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); background: transparent;
  border: 1px solid var(--line); padding: 7px 12px; cursor: pointer; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.moods button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.moods button:focus-visible { outline: 1px solid var(--glow); outline-offset: 3px; }
#w { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#w text { pointer-events: none; }
body.readable { --muted: #9ccfd9; --ink: #f2fdff; }
body.readable::after { display: none; }
.spin { display: flex; align-items: center; gap: 8px; }
.spin input { width: 110px; accent-color: var(--glow); }
#w g:focus { outline: none; }
#w g:focus-visible .shell { stroke-width: 2.5; }
.read { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px; font: 400 11px/1.7 var(--mono); color: var(--muted);
  letter-spacing: .12em; z-index: 3; white-space: pre; }
.read b { color: var(--accent); font-weight: 600; }
.card { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: 64px; width: min(330px, calc(100% - 32px)); z-index: 4;
  background: var(--card); backdrop-filter: blur(6px); padding: 18px 20px; box-sizing: border-box;
  opacity: 0; transform: translateX(24px); pointer-events: none; transition: opacity .35s, transform .35s; }
.card.on { opacity: 1; transform: none; pointer-events: auto; }
.card::before, .card::after { content: ""; position: absolute; width: 18px; height: 18px; border: 1px solid var(--glow); }
.card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.card h2 { margin: 0 0 2px; font: 500 22px var(--display); letter-spacing: .1em; text-transform: uppercase; }
.card .tag { font: 400 10px var(--mono); color: var(--muted); letter-spacing: .2em; margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; margin: 0 0 10px; font-size: 13px; }
.row span:last-child { font: 600 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.row i { grid-column: 1 / -1; display: block; height: 2px; background: var(--line); position: relative; overflow: hidden; }
.row i::after { content: ""; position: absolute; inset: 0; width: var(--p); background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.card .hint { font: 400 10px var(--mono); color: var(--muted); letter-spacing: .14em; margin-top: 14px; }
body.embed .bar, body.embed .read, body.embed .card { display: none; }
body.embed::before { display: none; }
@media (max-width: 760px) {
  .bar h1 { font-size: 13px; letter-spacing: .2em; }
  .card { top: auto; bottom: 12px; max-height: 42%; overflow-y: auto; }
  .read { display: none; }
}
</style>
</head>
<body data-mood="cold">
<header class="bar"><h1>Колесо · язык вида</h1><label class="spin">ВРАЩЕНИЕ <input type="range" id="spin" min="0" max="4" step="0.05" value="1"></label><div class="moods" role="group" aria-label="Настроение">
<button type="button" data-mood="cold" aria-pressed="true">Холод</button><button type="button" data-mood="armor" aria-pressed="false">Броня</button></div></header>
<svg id="w" role="img" aria-label="Колесо мира"></svg>
<aside class="card" id="card" aria-live="polite"></aside>
<div class="read" id="read"></div>
<script src="WHEEL-DATA.js"></script>
<script>

// ——— вид ———
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("w");
const card = document.getElementById("card"), read = document.getElementById("read");
const el = (t, a = {}, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const TAU = Math.PI * 2, clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
const pt = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];

// Пружина: масса 1, жёсткость k, затухание c. Цель меняется в любой момент — движение продолжается без рывка.
class Spring {
  constructor(x = 0, k = 170, c = 22) { this.x = x; this.v = 0; this.to = x; this.k = k; this.c = c; }
  step(dt) { const a = (this.to - this.x) * this.k - this.v * this.c; this.v += a * dt; this.x += this.v * dt; return this.x; }
}

function arc(a0, a1, r0, r1) {
  if (a1 - a0 >= TAU - 1e-3) {
    const ring = r => `M${r} 0A${r} ${r} 0 1 1 ${-r} 0A${r} ${r} 0 1 1 ${r} 0Z`;
    return ring(r1) + ring(r0);
  }
  const big = a1 - a0 > Math.PI ? 1 : 0, [x0, y0] = pt(a0, r1), [x1, y1] = pt(a1, r1), [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${big} 0 ${x3} ${y3}Z`;
}

const NAMES = Object.keys(INSIDE);
const share = items => items.length ? items.reduce((s, it) => s + it[1], 0) / items.length : 0;
// Подсекторы идут по порядку наук (DISCIPLINES), чтобы у каждой науки на колесе была сплошная дуга.
const AXIS = NAMES.map(name => {
  const order = (DISCIPLINES[name] || []).flatMap(([, list]) => list), place = sub => order.indexOf(sub) + 1 || 99;
  const subs = Object.entries(INSIDE[name]).sort(([x], [y]) => place(x) - place(y)).map(([sub, items]) => ({ sub, items, p: share(items) }));
  const discs = (DISCIPLINES[name] || []).map(([disc, list]) => ({ disc, ks: subs.map((s, k) => list.includes(s.sub) ? k : -1).filter(k => k >= 0) })).filter(d => d.ks.length);
  return { name, subs, discs, p: share(subs.flatMap(s => s.items)) };
});
const TOTAL = share(AXIS.flatMap(a => a.subs.flatMap(s => s.items)));

let R = 300, W = 0, H = 0, pointer = [9999, 9999], sel = -1, lastSel = 0, focusSub = -1;
// spin — множитель скорости колец (ползунок; 0 — стоят); phase — их накопленный ход, чтобы смена скорости шла без скачка.
// big — множитель букв на колесе: в режиме «Читать» подписи крупнее и светлее.
// still — вид «Тихо»: кольца стоят при любом ползунке, движутся только от руки.
let spin = 1, phase = 0, big = 1, still = false;
const open = new Spring(0, 120, 20), born = performance.now();

const defs = el("defs");
const glow = el("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
el("feGaussianBlur", { stdDeviation: "3", result: "b" }, glow);
const merge = el("feMerge", {}, glow); el("feMergeNode", { in: "b" }, merge); el("feMergeNode", { in: "SourceGraphic" }, merge);

const world = el("g");
const rings = el("g", {}, world), human = el("g", {}, world), axesG = el("g", {}, world), subsG = el("g", {}, world), hubG = el("g", {}, world);
const ticks = el("g", {}, rings), dash = el("circle", { fill: "none" }, rings), armor = el("g", {}, rings), sweep = el("path", {}, rings);

function buildRings() {
  ticks.replaceChildren(); armor.replaceChildren();
  for (let i = 0; i < 180; i++) {
    const a = i / 180 * TAU, long = i % 15 == 0, [x0, y0] = pt(a, R * 1.2), [x1, y1] = pt(a, R * (long ? 1.25 : 1.22));
    el("line", { x1: x0, y1: y0, x2: x1, y2: y1, "stroke-width": long ? 1.4 : .7, class: "tick" }, ticks);
    if (long) { const [tx, ty] = pt(a, R * 1.3); const t = el("text", { x: tx, y: ty, "text-anchor": "middle", "dominant-baseline": "middle", class: "deg" }, ticks); t.textContent = String(i * 2).padStart(3, "0"); }
  }
  for (let i = 0; i < 6; i++) el("path", { d: arc(i / 6 * TAU, i / 6 * TAU + .55, R * 1.36, R * 1.375), class: "seg" }, armor);
}

// Циферблат крутится рукой: тянешь кольцо делений — оно идёт за пальцем, отпускаешь — катится по инерции
// и тормозит до своего тихого хода. Каждое деление (2°) щёлкает, каждые 30° — щелчок тяжелее.
const dialHit = el("path", { fill: "transparent", "fill-rule": "evenodd", style: "cursor:grab;touch-action:none" }, world);
let dial = 0, dialV = 0, dragAt = null, dragT = 0, lastNotch = 0, lastClick = 0, audio = null;
function click(heavy) {
  const now = performance.now(); if (!audio || now - lastClick < 14) return; lastClick = now;
  const t = audio.currentTime, len = heavy ? .03 : .012, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, heavy ? 3 : 6);
  const src = audio.createBufferSource(), band = audio.createBiquadFilter(), gain = audio.createGain();
  band.type = "bandpass"; band.frequency.value = heavy ? 1800 : 3600; band.Q.value = heavy ? 2 : 4; gain.gain.value = heavy ? .5 : .28;
  src.buffer = buf; src.connect(band).connect(gain).connect(audio.destination); src.start(t);
}
function dialAngle(e) {
  const m = world.getScreenCTM().inverse(), q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
  return Math.atan2(q.y, q.x) * 180 / Math.PI;
}
dialHit.addEventListener("pointerdown", e => {
  if (!audio) try { audio = new AudioContext(); } catch (err) { audio = null; }
  audio?.resume(); dialHit.setPointerCapture(e.pointerId); dialHit.style.cursor = "grabbing";
  dragAt = dialAngle(e); dragT = performance.now(); dialV = 0;
});
dialHit.addEventListener("pointermove", e => {
  if (dragAt == null) return;
  const a = dialAngle(e), now = performance.now(); let d = a - dragAt; if (d > 180) d -= 360; if (d < -180) d += 360;
  dial += d; dragAt = a; const dt = Math.max(.004, (now - dragT) / 1000); dragT = now;
  dialV = dialV * .6 + d / dt * .4;
});
const release = () => { dragAt = null; dialHit.style.cursor = "grab"; };
dialHit.addEventListener("pointerup", release); dialHit.addEventListener("pointercancel", release);

const axisEls = AXIS.map((ax, i) => {
  const g = el("g", { tabindex: 0, role: "button", "aria-label": `${ax.name}, ${Math.round(ax.p * 100)}%`, style: "cursor:pointer" }, axesG);
  const shell = el("path", { class: "shell" }, g), fill = el("path", { class: "fill" }, g), edge = el("path", { class: "edge", filter: "url(#glow)" }, g);
  const name = el("text", { "text-anchor": "middle", class: "aname" }, g), pct = el("text", { "text-anchor": "middle", class: "apct" }, g);
  name.textContent = ax.name.toUpperCase();
  const hover = new Spring(0, 260, 24), shown = new Spring(0, 60, 16), weight = new Spring(1, 120, 20);
  g.addEventListener("pointerenter", () => hover.to = 1);
  g.addEventListener("pointerleave", () => hover.to = 0);
  g.addEventListener("click", () => pick(i));
  g.addEventListener("keydown", e => { if (e.key == "Enter" || e.key == " ") { e.preventDefault(); pick(i); } });
  return { g, shell, fill, edge, name, pct, hover, shown, weight };
});

const humanEls = HUMAN.map(([name, parents], i) => {
  const g = el("g", { style: "cursor:pointer" }, human), p = el("path", { class: "hum" }, g), t = el("text", { class: "hname", "text-anchor": "middle", "dominant-baseline": "middle" }, g);
  t.textContent = name;
  const links = parents.map(n => NAMES.indexOf(n)).filter(n => n >= 0);
  g.addEventListener("pointerenter", () => links.forEach(n => axisEls[n].hover.to = .6));
  g.addEventListener("pointerleave", () => links.forEach(n => axisEls[n].hover.to = 0));
  g.addEventListener("click", () => tell({ sector: name }));
  return { p, t, i };
});

const hub = el("circle", { class: "hub", style: "cursor:pointer" }, hubG), hubRing = el("circle", { class: "hubring", fill: "none" }, hubG);
const hubNum = el("text", { "text-anchor": "middle", class: "hubnum" }, hubG), hubCap = el("text", { "text-anchor": "middle", class: "hubcap" }, hubG);
const hubShown = new Spring(0, 40, 13);
hub.addEventListener("click", () => pick(-1));

let subEls = [];
let discEls = [];
function buildSubs() {
  subsG.replaceChildren();
  if (sel < 0) { subEls = []; discEls = []; return; }
  // Науки — внутренний пояс между центром и подсекторами, как на неоновой карте.
  discEls = AXIS[sel].discs.map(({ disc, ks }) => {
    const g = el("g", { style: "cursor:pointer" }, subsG), shell = el("path", {}, g), t = el("text", { "text-anchor": "middle", "dominant-baseline": "middle" }, g);
    t.textContent = disc;
    // Наведение на науку подсвечивает её саму и все её подсекторы, как на старом круге.
    const hover = new Spring(0, 260, 24);
    g.addEventListener("pointerenter", () => { hover.to = 1; ks.forEach(k => subEls[k].hover.to = .6); });
    g.addEventListener("pointerleave", () => { hover.to = 0; ks.forEach(k => subEls[k].hover.to = 0); });
    return { g, shell, t, disc, hover, k0: Math.min(...ks), k1: Math.max(...ks) };
  });
  subEls = AXIS[sel].subs.map((s, k) => {
    const g = el("g", { tabindex: 0, role: "button", "aria-label": `${s.sub}, ${Math.round(s.p * 100)}%`, style: "cursor:pointer" }, subsG);
    const shell = el("path", { class: "shell" }, g), fill = el("path", { class: "fill" }, g), edge = el("path", { class: "edge", filter: "url(#glow)" }, g);
    const t = el("text", { "text-anchor": "middle", class: "sname" }, g), q = el("text", { "text-anchor": "middle", class: "spct" }, g);
    t.textContent = s.sub;
    const hover = new Spring(0, 260, 24), grow = new Spring(0, 90, 16);
    g.addEventListener("pointerenter", () => hover.to = 1);
    g.addEventListener("pointerleave", () => hover.to = 0);
    const choose = () => { focusSub = k; showCard(); tell({ axis: AXIS[sel].name, sub: s.sub }); };
    g.addEventListener("click", e => { e.stopPropagation(); choose(); });
    g.addEventListener("keydown", e => { if (e.key == "Enter" || e.key == " ") { e.preventDefault(); choose(); } });
    // Кружочки вещей вокруг раскрытой оси, как на неоновой карте: полный — есть, половина — начато, пустой — нет.
    // Подписи видны у выбранного подсектора и у кружочка под указателем; щелчок — выбрать его подсектор.
    const dots = s.items.map(([thing, v, note]) => {
      const d = el("g", { style: "cursor:pointer" }, subsG), stalk = el("line", {}, d), ring = el("circle", {}, d), half = el("path", {}, d);
      const label = el("text", { "dominant-baseline": "middle" }, d); label.textContent = thing;
      const hot = new Spring(0, 260, 24);
      d.addEventListener("pointerenter", () => hot.to = 1); d.addEventListener("pointerleave", () => hot.to = 0);
      d.addEventListener("click", e => { e.stopPropagation(); choose(); });
      return { d, stalk, ring, half, label, hot, v };
    });
    return { g, shell, fill, edge, t, q, hover, grow, k, s, dots };
  });
}

function pick(i) {
  if (i == sel || i < 0) { sel = -1; focusSub = -1; open.to = 0; card.classList.remove("on"); setTimeout(() => { if (sel < 0) buildSubs(); }, 500); }
  else { sel = i; focusSub = -1; open.to = 1; buildSubs(); showCard(); }
  hubShown.x = 0;
  axisEls.forEach((a, k) => a.weight.to = sel < 0 ? 1 : (k == sel ? NAMES.length : 0));
  tell({ axis: sel < 0 ? null : NAMES[sel], sub: null });
}

// Пульт (родитель во ?embed) слышит, что выбрано на колесе, и сам может выбрать ось и подсектор.
// Пока исполняется выбор пульта, колесо не пересказывает его обратно.
let quiet = false;
function tell(what) { if (parent != window && quiet == false) parent.postMessage({ wheel: what }, "*"); }
addEventListener("message", e => {
  const want = e.data && e.data.choose; if (!want || e.source != parent) return;
  const i = want.axis == null ? -1 : NAMES.indexOf(want.axis);
  quiet = true;
  if (i < 0) { if (sel >= 0) pick(-1); }
  else {
    if (i != sel) pick(i);
    const k = want.sub == null ? -1 : AXIS[i].subs.findIndex(s => s.sub == want.sub);
    if (k != focusSub) { focusSub = k; showCard(); }
  }
  quiet = false;
});
addEventListener("message", e => {
  const d = e.data; if (!d || e.source != parent) return;
  if (typeof d.spin == "number") spin = d.spin;
  if (typeof d.still == "boolean") still = d.still;
  if (d.skin == "soft" || d.skin == "armor") { document.body.dataset.mood = d.skin; S = style(); }
  if (typeof d.readable == "boolean") { big = d.readable ? 1.25 : 1; document.body.classList.toggle("readable", d.readable); }
});

function showCard() {
  if (sel < 0) return;
  const ax = AXIS[sel];
  const rows = focusSub < 0
    ? ax.subs.map(s => [s.sub, s.p])
    : ax.subs[focusSub].items.map(([thing, st, note]) => [thing + (note ? ` · ${note}` : ""), st]);
  const head = focusSub < 0 ? ax.name : ax.subs[focusSub].sub;
  const tag = focusSub < 0 ? `ОСЬ ${String(sel + 1).padStart(2, "0")}/${String(NAMES.length).padStart(2, "0")} · ПОДСЕКТОРОВ ${ax.subs.length}` : `${ax.name.toUpperCase()} · ВЕЩЕЙ ${rows.length}`;
  card.innerHTML = `<h2></h2><div class="tag"></div>` + rows.map(() => `<div class="row"><span></span><span data-to="0">0%</span><i style="--p:0%"></i></div>`).join("") +
    `<div class="hint">${focusSub < 0 ? "ЩЁЛКНИ ПОДСЕКТОР · ЦЕНТР — НАЗАД" : "ЦЕНТР — НАЗАД К КОЛЕСУ"}</div>`;
  card.querySelector("h2").textContent = head; card.querySelector(".tag").textContent = tag;
  card.querySelectorAll(".row").forEach((r, k) => {
    r.children[0].textContent = rows[k][0];
    const to = Math.round(rows[k][1] * 100);
    r.children[1].dataset.to = to;
  });
  card.dataset.born = performance.now();
  card.classList.add("on");
}

// Отсчёт процентов в карточке: числа бегут к цели, а не появляются сразу.
function countCard(now) {
  if (!card.classList.contains("on")) return;
  const t = clamp((now - card.dataset.born) / 700, 0, 1), ease = 1 - Math.pow(1 - t, 3);
  card.querySelectorAll(".row").forEach(r => { const s = r.children[1]; s.textContent = Math.round(s.dataset.to * ease) + "%"; r.querySelector("i").style.setProperty("--p", s.dataset.to * ease + "%"); });
}

function resize() {
