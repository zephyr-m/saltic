<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saltic OS · интерфейс</title>
<style>
:root{--font-mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#0b0908;display:flex;justify-content:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#os{--c:#6fd8e6;--s:#f4936c;--t:#efe6d8;background:#0b0908;color:var(--t);font-family:var(--font-mono);font-size:12px;padding:10px;position:relative;overflow:hidden;width:100%;max-width:440px;box-sizing:border-box}
#os:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);pointer-events:none;z-index:5}
#os button{background:#15110e;color:var(--t);border:1px solid rgba(111,216,230,.4);padding:3px 8px;font:11px var(--font-mono);cursor:pointer;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
#bar{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;border-bottom:1px solid rgba(111,216,230,.25)}
#dock{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;padding:6px 0}
.chip{border:1px solid rgba(111,216,230,.5);padding:3px 8px;cursor:pointer;display:flex;gap:6px;align-items:center;animation:pop .4s both;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);background:#15110e}
#ln{display:block;margin:0 auto;width:100%;max-width:340px}
.nd{transform-box:fill-box;transform-origin:center;animation:pop .5s both;cursor:pointer}
.nd polygon{fill:#0b0908;stroke:var(--c);stroke-width:1.2}.nd .gl{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nd.on polygon{stroke:var(--s);stroke-width:2.2}.nd.on .gl{stroke:var(--s)}.nd.mn polygon{stroke-dasharray:4 3}
.r1{transform-box:fill-box;transform-origin:center;animation:sp 90s linear infinite}.r2{transform-box:fill-box;transform-origin:center;animation:sp 60s linear infinite reverse}
.pu{animation:pl 2.4s ease-in-out infinite}.sw{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}@keyframes pl{50%{opacity:.45}}
@keyframes op{from{clip-path:inset(48% 0 48% 0);opacity:.3}to{clip-path:inset(0);opacity:1}}
#bay{min-height:250px}.win{animation:op .5s ease-out both}
.wo{background:var(--c);padding:1px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.wi{background:#0f0c0a;padding:10px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.wh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.wh b{flex:1;font-weight:500}
.cb{display:flex;gap:6px;height:100px;align-items:flex-end}.bw{flex:1;height:100%;background:rgba(239,230,216,.08);position:relative;clip-path:polygon(0 6px,6px 0,100% 0,100% 100%,0 100%)}
.bw i{position:absolute;left:0;right:0;bottom:0;background:var(--c);transition:height .5s}
.pr{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}.pr span:first-child{flex:1}.pb{width:70px;height:5px;background:rgba(239,230,216,.1)}.pb i{display:block;height:100%;background:var(--c);transition:width .5s}
.lgl div{padding:2px 0}.dim{color:rgba(239,230,216,.5)}
@media (prefers-reduced-motion:reduce){.r1,.r2,.sw,.pu{animation:none}}
</style>
</head>
<body>
<h1 class="sr-only">Saltic OS: интерфейс операционной системы, демо, данные имитированы</h1>
<div id="os">
<div id="bar"><span id="lg" style="display:flex;gap:6px;align-items:center"></span><span id="clk"></span><span id="bt" style="display:flex;gap:6px;align-items:center"></span></div>
<div id="dock"></div>
<div id="ln0"></div>
<div id="bay"></div>
<div class="dim" style="text-align:center;margin-top:8px;font-size:11px">демо · данные имитированы</div>
</div>
<script>
const $=i=>document.getElementById(i),C='#6fd8e6',SA='#f4936c';
const G={core:'M10 2L17 6V14L10 18L3 14V6Z M10 7V13',proc:'M4 4L10 10L4 16 M11 4L17 10L11 16',mem:'M10 3L17 10L10 17L3 10Z M10 7L13 10L10 13L7 10Z',net:'M3 14L10 4L17 14 M6 14L10 8L14 14',spider:'M10 6V14 M3 4L8 9 M17 4L12 9 M3 16L8 11 M17 16L12 11',log:'M4 4H16 M4 8H13 M4 12H16 M4 16H10'};
const K=['core','proc','mem','net','spider','log'],N={core:'ядро',proc:'процессы',mem:'память',net:'сеть',spider:'паук',log:'журнал'};
const ST=['стойка','шаг','шаг','поворот','шаг','лезет'];
const S={full:null,mini:[],f:0,load:Array(8).fill(40),ga:.25,bat:84,procs:[['агент 34',1],['компилятор',1],['физика',0],['звук',1],['hirundo',0],['yamete-журнал',1]],lg:[]};
const MS=['> шаг → поворот','агент 34 слушает 10.0.0.2:5555','снимок 683×384 · 786 816 байт','самосборка: stage2 = stage3','yamete: Энергия жеткіліксіз: 40 қажет','арена такта сброшена','yamete: エネルギーが足りません：40 必要','вето: любое → авария','yamete: Vires non sufficiunt: opus est 40'];
const gl=(k,s,c)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 20 20" fill="none" stroke="'+(c||C)+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="'+G[k]+'"/></svg>';
$('lg').innerHTML=gl('core',18,SA)+'<b style="font-weight:500;letter-spacing:1px">SALTIC·OS</b>';
function launcher(){let seed=7;const r=n=>Math.floor(((seed=(seed*9301+49297)%233280)/233280)*n);
 let tk='',gs='';for(let i=0;i<60;i++)tk+='<line x1="180" y1="12" x2="180" y2="'+(i%5?17:22)+'" transform="rotate('+i*6+' 180 180)" stroke="'+C+'" stroke-opacity="'+(i%5?.35:.85)+'"/>';
 for(let i=0;i<24;i++){let d='M'+(177+r(7))+' '+(26+r(10));for(let s=0;s<3;s++)d+='L'+(177+r(7))+' '+(26+r(10));gs+='<path d="'+d+'" transform="rotate('+i*15+' 180 180)" fill="none" stroke="'+SA+'" stroke-opacity=".7"/>';}
 const nd=K.map((k,i)=>{const a=(-90+i*60)*Math.PI/180,x=180+108*Math.cos(a),y=180+108*Math.sin(a);
  const hx=[0,1,2,3,4,5].map(j=>{const b=(30+j*60)*Math.PI/180;return (x+37*Math.cos(b)).toFixed(1)+','+(y+37*Math.sin(b)).toFixed(1);}).join(' ');
  return '<g class="nd" data-m="'+k+'" id="nd'+k+'" style="animation-delay:'+i*.12+'s"><polygon points="'+hx+'"/><g transform="translate('+(x-9)+' '+(y-21)+') scale(.9)"><path class="gl" d="'+G[k]+'"/></g><text x="'+x+'" y="'+(y+24)+'" text-anchor="middle" font-size="11" fill="#efe6d8">'+N[k]+'</text></g>';}).join('');
 $('ln0').innerHTML='<svg id="ln" viewBox="0 0 360 360"><g class="r1"><circle cx="180" cy="180" r="168" fill="none" stroke="'+C+'" stroke-opacity=".25"/>'+tk+gs+'</g><g class="r2"><circle cx="180" cy="180" r="146" fill="none" stroke="'+C+'" stroke-opacity=".4" stroke-dasharray="3 9"/></g><polygon class="pu" points="220,180 200,214.6 160,214.6 140,180 160,145.4 200,145.4" fill="#0b0908" stroke="'+SA+'" stroke-width="1.5"/><text x="180" y="177" text-anchor="middle" font-size="11" fill="#efe6d8">saltic</text><text x="180" y="192" text-anchor="middle" font-size="13" fill="'+SA+'">OS</text>'+nd+'</svg>';}
const BODY={
 core:()=>'<div class="cb">'+[0,1,2,3,4,5,6,7].map(i=>'<div class="bw"><i id="c'+i+'" style="height:40%"></i></div>').join('')+'</div><div id="ci" class="dim" style="margin-top:8px"></div>',
 proc:()=>S.procs.map((p,i)=>'<div class="pr" data-p="'+i+'"><span>'+p[0]+'</span><span id="ps'+i+'" class="dim"></span><div class="pb"><i id="pb'+i+'" style="width:5%"></i></div></div>').join('')+'<div class="dim" style="margin-top:6px;font-size:11px">тап по строке: усыпить или разбудить</div>',
 mem:()=>'<div style="display:flex;gap:14px;align-items:center"><svg width="150" height="150" viewBox="0 0 180 180">'+[[70,'m0'],[52,'m1'],[34,'m2']].map(a=>'<circle cx="90" cy="90" r="'+a[0]+'" fill="none" stroke="#efe6d8" stroke-opacity=".1" stroke-width="9"/><circle id="'+a[1]+'" cx="90" cy="90" r="'+a[0]+'" fill="none" stroke="'+(a[1]==='m1'?SA:C)+'" stroke-width="9" stroke-dasharray="0 999" transform="rotate(-90 90 90)"/>').join('')+'</svg><div style="line-height:2">арена графа <b id="mt0" style="font-weight:500"></b><br>арена такта <b id="mt1" style="font-weight:500"></b><br>куча <b id="mt2" style="font-weight:500"></b></div></div><div class="dim" style="margin-top:6px;font-size:11px">такт заполняется и сбрасывается, граф растёт медленно</div>',
 net:()=>'<div style="display:flex;gap:14px;align-items:center"><svg width="150" height="150" viewBox="0 0 150 150"><g fill="none" stroke="'+C+'" stroke-opacity=".3"><circle cx="75" cy="75" r="20"/><circle cx="75" cy="75" r="45"/><circle cx="75" cy="75" r="70"/><path d="M5 75H145M75 5V145"/></g><g class="sw"><path d="M75 75L145 75" stroke="'+C+'" stroke-width="2"/><path d="M75 75L145 75A70 70 0 0 0 125 26Z" fill="'+C+'" fill-opacity=".12" transform="rotate(0 75 75)"/></g><circle cx="110" cy="50" r="4" fill="'+SA+'"/><circle cx="48" cy="100" r="4" fill="'+SA+'"/></svg><div style="line-height:2">acer 10.0.0.2 <b id="pg0" style="font-weight:500"></b><br>паук 10.0.0.7 <b id="pg1" style="font-weight:500"></b><br><span class="dim">Wi-Fi: сеть не найдена</span></div></div>',
 spider:()=>'<svg width="100%" viewBox="0 0 220 150" style="max-height:150px"><g fill="none" stroke="'+C+'" stroke-width="1.6" stroke-linejoin="round">'+[0,1,2,3,4,5].map(i=>'<path id="l'+i+'"/>').join('')+'<polygon points="110,38 124,52 124,94 110,108 96,94 96,52" fill="#0f0c0a"/></g><circle cx="105" cy="50" r="3" fill="#efe6d8"/><circle cx="115" cy="50" r="3" fill="#efe6d8"/></svg>',
 log:()=>'<div class="lgl" id="lgb"></div>'};
const UPD={
 core:()=>{S.load=S.load.map(v=>Math.max(8,Math.min(96,v+(Math.random()-.5)*26)));S.load.forEach((v,i)=>{const e=$('c'+i);if(e)e.style.height=v+'%';});const c=$('ci');if(c)c.textContent='кадр '+String(S.f*36).padStart(6,'0')+' · '+(38+Math.round(S.load[0]/12))+' °C · '+ST[S.f%ST.length];},
 proc:()=>S.procs.forEach((p,i)=>{const s=$('ps'+i),b=$('pb'+i);if(!s)return;s.textContent=p[1]?'работает':'спит';b.style.width=(p[1]?20+Math.random()*70:3)+'%';}),
 mem:()=>{S.ga=S.ga>.93?.12:S.ga+.012;const v=[S.ga,(S.f%12)/12,.45+.1*Math.sin(S.f/3)],Cc=[440,327,214];v.forEach((x,i)=>{const e=$('m'+i);if(e)e.setAttribute('stroke-dasharray',(x*Cc[i])+' '+Cc[i]);const t=$('mt'+i);if(t)t.textContent=Math.round(x*100)+'%';});},
 net:()=>{const a=$('pg0');if(a){a.textContent=(2+Math.round(Math.random()*3))+' мс';$('pg1').textContent=(6+Math.round(Math.random()*8))+' мс';}},
 spider:()=>{},
 log:()=>{const m=MS[S.f%MS.length];S.lg.push({t:new Date().toTimeString().slice(0,8),m});if(S.lg.length>7)S.lg.shift();const e=$('lgb');if(e)e.innerHTML=S.lg.map(l=>'<div style="color:'+(/yamete|вето/.test(l.m)?SA:'#efe6d8')+'"><span class="dim">'+l.t+'</span> '+l.m+'</div>').join('');}};
const LIVE={core:()=>Math.round(S.load.reduce((a,b)=>a+b,0)/8)+'%',proc:()=>S.procs.filter(p=>p[1]).length+' раб.',mem:()=>Math.round(S.ga*100)+'%',net:()=>'3 мс',spider:()=>ST[S.f%ST.length],log:()=>S.lg.length+' строк'};
function spd(now){if(S.full!=='spider')return;const t=now/1000;for(let i=0;i<6;i++){const s=i<3?-1:1,r=i%3,hx=110+s*14,hy=58+r*18,ph=[0,4,2].includes(i)?0:Math.PI,fx=hx+s*(40+6*Math.cos(t*5+ph)),fy=hy+(r-1)*12+10*Math.sin(t*5+ph),lift=Math.max(0,Math.cos(t*5+ph)),kx=hx+s*24,ky=hy-10-8*lift,e=$('l'+i);if(e)e.setAttribute('d','M'+hx+' '+hy+'L'+kx+' '+ky+'L'+fx+' '+fy);}requestAnimationFrame(spd);}
function sync(){K.forEach(k=>{const n=$('nd'+k);if(n)n.setAttribute('class','nd'+(S.full===k?' on':'')+(S.mini.includes(k)?' mn':''));});
 $('dock').innerHTML=S.mini.length?S.mini.map(k=>'<span class="chip" data-c="'+k+'">'+gl(k,14)+N[k]+' <span style="color:#f4936c">'+LIVE[k]()+'</span></span>').join(''):'<span class="dim" style="font-size:11px">свёрнутые окна живут здесь чипами</span>';}
function bay(){const k=S.full;$('bay').innerHTML=k?'<div class="win"><div class="wo"><div class="wi"><div class="wh">'+gl(k,18,SA)+'<b>'+N[k]+'</b><button data-a="min">⇄ в чип</button><button data-a="x">✕</button></div>'+BODY[k]()+'</div></div></div>':'<div class="dim" style="text-align:center;padding:90px 0">выбери модуль на пульте</div>';if(k){UPD[k]();if(k==='spider')requestAnimationFrame(spd);}sync();}
function open(k){if(S.full&&S.full!==k&&!S.mini.includes(S.full))S.mini.push(S.full);S.mini=S.mini.filter(x=>x!==k);S.full=k;bay();}
$('os').addEventListener('click',e=>{const t=e.target.closest('[data-m],[data-c],[data-a],[data-p]');if(!t)return;const d=t.dataset;
 if(d.m||d.c)open(d.m||d.c);else if(d.a==='min'){if(!S.mini.includes(S.full))S.mini.push(S.full);S.full=null;bay();}
 else if(d.a==='x'){S.mini=S.mini.filter(x=>x!==S.full);S.full=null;bay();}
 else if(d.p!==undefined){const p=S.procs[+d.p];p[1]=p[1]?0:1;UPD.proc();}});
setInterval(()=>{S.f++;S.bat=Math.max(5,S.bat-0.03);$('clk').textContent=new Date().toTimeString().slice(0,5);$('bt').innerHTML='<span class="dim">энергон</span><span style="width:46px;height:6px;background:rgba(239,230,216,.12);display:inline-block"><i style="display:block;height:100%;width:'+S.bat+'%;background:#6fd8e6"></i></span>';if(S.full)UPD[S.full]();sync();},600);
launcher();open('core');
</script>
</body>
</html>
