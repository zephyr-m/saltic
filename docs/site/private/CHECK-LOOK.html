<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка всего</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Три ступеньки тьмы, как на пульте: фон самый тёмный, ветки — светлее, клетки случаев внутри — снова темнее. */
/* Вид пульта проверок в коже «Тихо»: всё поле global-check нарисовано разом — подготовка, затем ветки,
   у ветки её случаи. Каждый случай — крутилка со своим временем; кончился — галочка или крест.
   Ветки и случаи — настоящие, из журналов прошлого прогона; время и провалы — образец. */
:root {
  --bg: #07090d; --panel: #0f141d; --cell: #090c12; --line: #222a37; --ink: #eef1f6; --muted: #8b94a4; --dim: #5d6675;
  --run: #46c8ff; --ok: #6dff9a; --os: #ffd25e; --bad: #ff5a6e;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --mono: "JetBrains Mono", ui-monospace, monospace; --display: "Onest", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink);
  font-family: var(--display); min-height: 100vh; }
.wrap { padding: 22px max(16px, 1.5vw) 120px; }

.top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px 24px; align-items: center; margin-bottom: 18px; }
.top .knobs { justify-self: end; }
/* Главное число — сколько проверок пройдено: по центру, крупнее всего; пока идёт — голубое, в конце — зелёное или красное. */
.hero { text-align: center; }
.hero b { display: block; font: 700 clamp(56px, 7vw, 112px)/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  color: var(--run); text-shadow: 0 0 40px rgba(70, 200, 255, .35); transition: color .6s, text-shadow .6s; }
.hero.ok b { color: var(--ok); text-shadow: 0 0 40px rgba(109, 255, 154, .35); }
.hero.bad b { color: var(--bad); text-shadow: 0 0 40px rgba(255, 90, 110, .35); }
.hero span { font: 400 14px var(--mono); color: var(--muted); letter-spacing: .08em; }
.hero span em { font-style: normal; color: var(--ink); }
.top h1 { margin: 0; font: 700 26px var(--display); letter-spacing: .02em; }
.top .sub { font: 400 12px var(--mono); color: var(--dim); margin-top: 4px; letter-spacing: .06em; }
.knobs { display: flex; gap: 8px; }
.knobs button { font: 500 13px var(--display); color: var(--ink); background: #18202c; border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 14px; cursor: pointer; transition: transform .35s var(--spring), background .2s, border-color .2s; }
.knobs button:hover { transform: translateY(-1px); border-color: #33405a; }
.knobs button.main { background: var(--os); border-color: var(--os); color: #120d02; }
.knobs button[aria-pressed="true"] { border-color: var(--run); color: var(--run); }

.meter { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, auto) 1fr auto; gap: 26px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 22px; }
.count { display: grid; gap: 2px; }
.count b { font: 700 34px/1 var(--mono); font-variant-numeric: tabular-nums; }
.count span { font: 400 11px var(--mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.count.ok b { color: var(--ok); } .count.bad b { color: var(--bad); } .count.run b { color: var(--run); } .count.wait b { color: var(--dim); }
.bar { height: 6px; border-radius: 3px; background: var(--cell); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .4s ease; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }
.clock { font: 600 22px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.clock small { display: block; font: 400 11px var(--mono); color: var(--muted); letter-spacing: .12em; }

h2.stage { font: 600 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  margin: 26px 0 10px; display: flex; gap: 10px; align-items: center; }
h2.stage::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.branches { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.branch { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px;
  transition: transform .45s var(--spring), box-shadow .45s ease, border-color .3s; }
.branch:hover { transform: translateY(-3px); box-shadow: 0 20px 44px rgba(0, 0, 0, .45); border-color: #33405a; }
.branch.wide { grid-column: 1 / -1; }
.branch header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.branch header b { font: 700 15px var(--display); }
.branch header .proc { font: 500 11px var(--mono); color: var(--os); border: 1px solid rgba(255, 210, 94, .35); border-radius: 7px; padding: 1px 7px; }
.branch header .sum { margin-left: auto; font: 400 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.branch.done-ok header .sum { color: var(--ok); } .branch.done-bad header .sum { color: var(--bad); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }

.cell { display: grid; grid-template-columns: 24px 1fr auto; gap: 0 8px; align-items: center; padding: 7px 9px; border-radius: 10px;
  background: var(--cell); border: 1px solid transparent; cursor: pointer; text-align: left; color: inherit; font: inherit;
  opacity: 0; transform: scale(.9); animation: appear .5s var(--spring) forwards; animation-delay: var(--d);
  transition: transform .35s var(--spring), border-color .2s, background .2s; }
@keyframes appear { to { opacity: 1; transform: none; } }
.cell:hover { transform: translateY(-2px) scale(1.02); border-color: #33405a; }
.cell .n { font: 500 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .t { font: 400 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .k { grid-column: 2 / -1; font: 400 10px var(--mono); color: var(--dim); }
.cell.wait .n { color: var(--muted); }
.cell.run { background: rgba(70, 200, 255, .07); border-color: rgba(70, 200, 255, .35); }
.cell.run .t { color: var(--run); }
.cell.fail { background: rgba(255, 90, 110, .08); border-color: rgba(255, 90, 110, .45); }
.cell.fail .t, .cell.fail .k { color: var(--bad); }
.cell.ok .k { color: #4c8f62; }
.cell[aria-pressed="true"] { border-color: var(--ink); }

.sp { width: 24px; height: 24px; display: block; }
.sp circle { fill: none; stroke-width: 2.2; }
.sp .track { stroke: var(--line); }
.sp .arc { stroke: var(--run); stroke-linecap: round; stroke-dasharray: 16 100; opacity: 0; transform-origin: 12px 12px; }
.sp .dot { fill: var(--dim); stroke: none; }
.sp .mark { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.run .sp .arc { opacity: 1; animation: spin .8s linear infinite; filter: drop-shadow(0 0 3px var(--run)); }
.run .sp .dot, .ok .sp .dot, .fail .sp .dot { opacity: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok .sp .track { stroke: var(--ok); } .ok .sp .mark { stroke: var(--ok); }
.fail .sp .track { stroke: var(--bad); } .fail .sp .mark { stroke: var(--bad); }
.ok .sp .mark, .fail .sp .mark { stroke-dashoffset: 0; transition: stroke-dashoffset .45s ease .05s; }
.ok .sp, .fail .sp { animation: pop .5s var(--spring); }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: none; } }

.drawer { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(420px, calc(100% - 32px)); z-index: 5;
  background: rgba(18, 23, 34, .96); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6); overflow-y: auto;
  transform: translateX(calc(100% + 24px)); transition: transform .55s var(--spring); }
.drawer.on { transform: none; }
.drawer .close { position: absolute; top: 14px; right: 14px; background: #18202c; border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font: 500 14px var(--display); }
.drawer .where { font: 400 11px var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.drawer h3 { margin: 4px 0 4px; font: 700 22px var(--display); }
.drawer .state { font: 500 13px var(--mono); margin-bottom: 16px; }
.drawer .state.ok { color: var(--ok); } .drawer .state.fail { color: var(--bad); } .drawer .state.run { color: var(--run); } .drawer .state.wait { color: var(--muted); }
.failure { background: var(--cell); border: 1px solid rgba(255, 90, 110, .3); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.failure b { display: block; font: 500 13px var(--display); margin-bottom: 8px; }
.failure dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font: 400 12px var(--mono); }
.failure dt { color: var(--muted); } .failure dd { margin: 0; }
.failure dd.got { color: var(--bad); } .failure dd.want { color: var(--ok); }
.drawer p { color: var(--muted); font-size: 14px; line-height: 1.5; }

.done-banner { margin-top: 18px; font: 500 14px var(--display); color: var(--muted); text-align: center; opacity: 0; transition: opacity .6s; }
.done-banner.on { opacity: 1; }

@media (max-width: 760px) {
  .meter { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .meter .bar, .meter .clock { grid-column: 1 / -1; text-align: left; }
  .top { grid-template-columns: 1fr; } .top .knobs { justify-self: start; }
  .count b { font-size: 26px; }
  .branches { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Проверка всего</h1><div class="sub">global-check · образец прошлого прогона · время и провалы — образец</div></div>
    <div class="hero" id="hero"><b id="checks">0</b><span>из <em id="total">0</em> проверок</span></div>
    <div class="knobs"><button type="button" id="sound" aria-pressed="true">звук</button><button type="button" id="fast" aria-pressed="false">быстрее ×4</button><button type="button" class="main" id="again">▶ заново</button></div>
    <div class="meter">
      <div class="count ok"><b id="cOk">0</b><span>прошло</span></div>
      <div class="count bad"><b id="cBad">0</b><span>провал</span></div>
      <div class="count run"><b id="cRun">0</b><span>идёт</span></div>
      <div class="count wait"><b id="cWait">0</b><span>ждёт</span></div>
      <div class="bar" aria-hidden="true"><i class="g" id="barOk"></i><i class="r" id="barBad"></i></div>
      <div class="clock"><span id="clock">00:00.0</span><small>прошло времени</small></div>
    </div>
  </div>
  <h2 class="stage">подготовка — по очереди</h2>
  <div class="branches" id="prep"></div>
  <h2 class="stage">ветки — разом</h2>
  <div class="branches" id="field"></div>
  <div class="done-banner" id="banner"></div>
</div>
<aside class="drawer" id="drawer" aria-live="polite"><button type="button" class="close" id="close" aria-label="Закрыть">✕</button><div id="dossier"></div></aside>
<script>
// Случаи тестов — строка «случаи:» из журналов check-*-all.log; число проверок — строки [ok]/[FAIL] случая в тех же
// журналах, у случая без них (сверка вывода с эталоном) — одна проверка. Всего выходит ~25 000.
const CASES = ["checker", "fixed-types", "fraction", "wide", "modules", "json-rpc", "diagnostics", "groups", "bytes", "edges", "always", "rva23",
  "rv64", "arm64", "x86-encoder", "arm64-encoder", "xtensa-encoder", "dict", "crypto", "apk", "seed-contract", "machine", "abi", "memory",
  "platform", "process", "native"];
const KNOWN = { crypto: 3, apk: 15, "seed-contract": 178, machine: 5725, abi: 139, memory: 22, native: 22 };
// Провалы образца — из прогона памяти 15.11.2026.
const FAILS = { "x86-64 тесты/memory": [
  { what: "вечность, строка: долгий рост кучи, байт", got: "8", want: "0" },
  { what: "группа 20000 по одному: без ошибки и верно", got: "no", want: "yes" }] };

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const checksOf = name => KNOWN[name] ?? 1;
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a == 1 && b != 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const checksWord = n => n.toLocaleString("ru-RU") + " " + plural(n, "проверка", "проверки", "проверок");
const timeOf = checks => .5 + Math.log10(checks + 1) * (.6 + rnd() * .8) + rnd() * .6;
const steps = (list, secs, checks = []) => list.map((name, k) => ({ name, checks: checks[k] || 0, dur: secs[k] }));

function plan() {
  seed = 7;
  const tests = proc => ({ name: "тесты", proc, wide: true, items: CASES.map(name => { const checks = checksOf(name); return { name, checks, dur: name == "machine" ? 7 : timeOf(checks) }; }) });
  return {
    prep: [{ name: "подготовка", proc: "x86-64", wide: true, items: steps(["лимиты канона", "сборка проверок", "самосборка полки"], [1.4, 3.2, 5]) }],
    field: [tests("rv32i"), tests("x86-64"), tests("rv64"), tests("arm64"),
      { name: "ОС", proc: "x86-64", items: [["jtml", 31], ["events", 19], ["tasks", 16], ["panels", 27], ["mrpc", 26]].map(([name, checks]) => ({ name, checks, dur: timeOf(checks) })) },
      { name: "платформы", proc: "rv32i", items: steps(["qemu-virt", "uefi", "closure"], [2.2, 3.1, 1.6]) },
      { name: "самосборка", proc: "rv64", items: steps(["stage1", "stage2 и stage3", "fixed point", "сверка с полкой"], [3, 14, .6, .8]) },
      { name: "самосборка", proc: "arm64", items: steps(["stage1", "stage2 и stage3", "fixed point", "сверка с полкой"], [3, 11, .6, .8]) },
      { name: "кодировщик", proc: "x86-64", items: steps(["GNU as", "сборка команд", "сверка"], [.4, 2.1, .5], [0, 0, 138]) },
      { name: "кодировщик", proc: "arm64", items: steps(["GNU as", "сборка команд", "сверка"], [.4, 2.4, .5], [0, 0, 74]) },
      { name: "плата", proc: "esp32", items: steps(["плата или кодировщик", "сборка команд", "сверка"], [.6, 1.4, .5], [0, 0, 57]) },
      { name: "wasm", proc: "Node WASI", items: steps(["wasm"], [4.5]) }]
  };
}

const NS = "http://www.w3.org/2000/svg";
const spinner = () => `<svg class="sp" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="arc" cx="12" cy="12" r="9"/><circle class="dot" cx="12" cy="12" r="2"/><path class="mark"/></svg>`;
const fmt = s => s < 60 ? s.toFixed(1) + "с" : Math.floor(s / 60) + "м " + String(Math.floor(s % 60)).padStart(2, "0") + "с";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let P, all, branches, clock0, speed = 1, simT = 0, last = 0, picked = null, finished = false, prepWas = false;

// Звуки — синтез WebAudio, без файлов. Шаг подготовки — низкий клац с подъёмом, конец подготовки — взлёт (ветки
// пошли разом), случай прошёл — стеклянный пинг из пентатоники (частые пинги сливаются в мелодию), провал — низкое
// дрожание двух близких тонов; итог — восходящий аккорд или нисходящий. Браузер даёт звук только после первого щелчка.
let audio = null, sound = true, lastPing = 0;
function ear() { if (sound == false) return null; if (audio == null) audio = new AudioContext(); if (audio.state == "suspended") audio.resume(); return audio; }
function tone(freq, at, dur, { type = "sine", vol = .08, to = 0, cut = 0 } = {}) {
  const a = audio; if (a == null || sound == false || a.state != "running") return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let tail = g;
  if (cut) { const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut; g.connect(f); tail = f; }
  o.connect(g); tail.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
const sfx = {
  prepStep() { tone(196, 0, .35, { vol: .09, to: 294 }); tone(392, .02, .2, { type: "triangle", vol: .04 }); },
  launch() { tone(160, 0, .7, { vol: .07, to: 640 }); [392, 523.25, 659.25].forEach((f, k) => tone(f, .25 + k * .06, .6, { type: "triangle", vol: .045 })); },
  ping() { const now = performance.now(); if (now - lastPing < 45) return; lastPing = now;
    const f = PENTA[Math.floor(Math.random() * PENTA.length)]; tone(f, 0, .22, { type: "triangle", vol: .035 }); tone(f * 2, 0, .12, { vol: .012 }); },
  fail() { tone(110, 0, .55, { type: "sawtooth", vol: .06, cut: 700 }); tone(116.5, 0, .55, { type: "sawtooth", vol: .06, cut: 700 }); },
  win() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, k) => tone(f, k * .09, .9 - k * .08, { type: "triangle", vol: .07 })); },
  lose() { [392, 349.23, 293.66, 220].forEach((f, k) => tone(f, k * .16, .5, { type: "square", vol: .03, cut: 1200 })); }
};
addEventListener("pointerdown", () => ear());

function build() {
  P = plan(); all = []; branches = [];
  let order = 0;
  for (const [box, list] of [[document.getElementById("prep"), P.prep], [document.getElementById("field"), P.field]]) {
    box.replaceChildren();
    for (const b of list) {
      const el = document.createElement("section"); el.className = "branch" + (b.wide ? " wide" : "");
      el.innerHTML = `<header><b>${esc(b.name)}</b><span class="proc">${esc(b.proc)}</span><span class="sum"></span></header><div class="cells"></div>`;
      box.appendChild(el);
      const cells = el.querySelector(".cells"), br = { ...b, el, sum: el.querySelector(".sum"), at: 0, start: null, prep: list == P.prep };
      br.items = b.items.map(it => {
        const c = document.createElement("button"); c.type = "button"; c.className = "cell wait"; c.style.setProperty("--d", (order++ * 4) + "ms");
        c.innerHTML = spinner() + `<span class="n">${esc(it.name)}</span><span class="t">·</span><span class="k">${it.checks ? checksWord(it.checks) : "шаг"}</span>`;
        cells.appendChild(c);
        const item = { ...it, br, c, t: c.querySelector(".t"), k: c.querySelector(".k"), mark: c.querySelector(".mark"), st: "wait", s: 0, e: 0,
          fails: FAILS[b.proc + " " + b.name + "/" + it.name] || [] };
        c.addEventListener("click", () => show(item));
        all.push(item); return item;
      });
      branches.push(br);
    }
  }
  document.getElementById("total").textContent = all.reduce((s, x) => s + x.checks, 0).toLocaleString("ru-RU");
  document.getElementById("hero").className = "hero";
  simT = 0; last = performance.now(); finished = false; prepWas = false;
  document.getElementById("banner").className = "done-banner"; hide();
}

function setState(it, st) {
  it.st = st; it.c.className = "cell " + st;
  if (st == "ok") it.mark.setAttribute("d", "M7.5 12.5l3 3L16.8 9.2");
  if (st == "fail") it.mark.setAttribute("d", "M8.8 8.8l6.4 6.4M15.2 8.8l-6.4 6.4");
  if (picked == it) show(it);
}

// Подготовка идёт по очереди, потом все ветки разом; внутри ветки — случай за случаем, как tests/run.
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000) * speed; last = now; simT += dt;
  const prep = branches.filter(b => b.prep), prepDone = prep.every(b => b.at >= b.items.length);
  for (const b of branches) {
    if (b.prep == false && prepDone == false) continue;
    if (b.at >= b.items.length) continue;
    const it = b.items[b.at];
    if (it.st == "wait") { it.s = simT; setState(it, "run"); }
    const spent = simT - it.s;
    it.t.textContent = fmt(spent);
    if (spent >= it.dur) {
      it.e = simT; it.t.textContent = fmt(it.dur);
      if (it.checks) it.k.textContent = it.fails.length ? `${it.checks - it.fails.length} из ${it.checks}` : `${it.checks.toLocaleString("ru-RU")} ✓`;
      setState(it, it.fails.length ? "fail" : "ok"); b.at++;
      if (it.fails.length) sfx.fail(); else if (b.prep) sfx.prepStep(); else sfx.ping();
      if (b.at >= b.items.length) {
        const bad = b.items.filter(x => x.st == "fail").length;
        b.el.classList.add(bad ? "done-bad" : "done-ok");
      }
    }
    if (b.prep && prepWas == false && prep.every(p => p.at >= p.items.length)) { prepWas = true; sfx.launch(); }
    const done = b.items.filter(x => x.st == "ok" || x.st == "fail").length;
    b.sum.textContent = `${done} / ${b.items.length}`;
  }
  const n = st => all.filter(x => x.st == st).length, ok = n("ok"), bad = n("fail");
  document.getElementById("cOk").textContent = ok; document.getElementById("cBad").textContent = bad;
  document.getElementById("cRun").textContent = n("run"); document.getElementById("cWait").textContent = n("wait");
  document.getElementById("barOk").style.width = ok / all.length * 100 + "%"; document.getElementById("barBad").style.width = bad / all.length * 100 + "%";
  const checks = all.filter(x => x.st == "ok" || x.st == "fail").reduce((s, x) => s + x.checks, 0);
  document.getElementById("checks").textContent = checks.toLocaleString("ru-RU");
  if (finished == false) document.getElementById("clock").textContent = fmt(simT).replace("с", "");
  if (finished == false && ok + bad == all.length) {
    finished = true;
    const banner = document.getElementById("banner");
    const total = all.reduce((s, x) => s + x.checks, 0).toLocaleString("ru-RU");
    banner.textContent = bad ? `итог: проверок ${total}, случаев ${all.length}, провалено ${bad} — щёлкни по красному` : `итог: всё зелёное, проверок ${total}, случаев ${all.length} 🫒`;
    banner.className = "done-banner on";
    document.getElementById("hero").className = "hero " + (bad ? "bad" : "ok");
    setTimeout(() => bad ? sfx.lose() : sfx.win(), 350);
  }
  requestAnimationFrame(tick);
}

function show(it) {
  if (picked) picked.c.setAttribute("aria-pressed", "false");
  picked = it; it.c.setAttribute("aria-pressed", "true");
  const word = { wait: "ждёт очереди", run: "идёт · " + fmt(simT - it.s), ok: "прошло за " + fmt(it.dur), fail: "провал · " + fmt(it.dur) }[it.st];
  let html = `<div class="where">${esc(it.br.name)} · ${esc(it.br.proc)}</div><h3>${esc(it.name)}</h3><div class="state ${it.st}">${word}</div>`;
  if (it.st == "fail") html += it.fails.map(f => `<div class="failure"><b>${esc(f.what)}</b><dl><dt>вышло</dt><dd class="got">${esc(f.got)}</dd><dt>ждали</dt><dd class="want">${esc(f.want)}</dd></dl></div>`).join("");
  else if (it.st == "ok") html += `<p>${it.checks ? `Все ${it.checks} проверок прошли.` : "Шаг прошёл."} В живом пульте здесь будет хвост журнала этого случая.</p>`;
  else html += `<p>${it.st == "run" ? "Крутится — время тикает." : "Ветка дойдёт до него по очереди."}</p>`;
  document.getElementById("dossier").innerHTML = html;
  document.getElementById("drawer").classList.add("on");
}
function hide() { if (picked) picked.c.setAttribute("aria-pressed", "false"); picked = null; document.getElementById("drawer").classList.remove("on"); }

document.getElementById("close").addEventListener("click", hide);
addEventListener("keydown", e => { if (e.key == "Escape") hide(); });
document.getElementById("again").addEventListener("click", build);
document.getElementById("sound").addEventListener("click", e => { sound = sound == false; e.currentTarget.setAttribute("aria-pressed", String(sound)); if (sound) ear(); });
document.getElementById("fast").addEventListener("click", e => { speed = speed == 1 ? 4 : 1; e.currentTarget.setAttribute("aria-pressed", String(speed == 4)); });
build(); requestAnimationFrame(tick);
</script>
<script src="PAGES.js"></script>
</body>
