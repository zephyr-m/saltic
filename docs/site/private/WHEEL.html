<style>
/* Колесо: внутри — семь природных осей, снаружи — человеческие сектора. Щелчок по оси — её малое колесо и таблица,
   по сектору — дерево подсекторов с прогрессом. Две темы: «Сайт» и «Неон». */
/* Слой: одно колесо по центру — внутри природные оси, снаружи человеческие области; щелчок по оси — её собственное колесо */
/* Две темы: «сайт» — палитра и шрифты сайта (светлая и тёмная вслед за сайтом), «неон» — тёмная с яркими линиями */
.wheel-page {
  --w-bg: var(--bg); --w-ink: var(--ink); --w-muted: var(--muted); --w-edge: var(--line); --w-gold: var(--sand);
  --w-cell: var(--surface); --w-cell2: var(--sunk); --w-card: var(--surface); --w-track: var(--sunk); --w-hair: var(--line);
  --w-dim: var(--line); --w-dim2: var(--muted); --w-soft: var(--ink); --w-on: #2b211a; --w-shadow: rgba(60, 40, 20, .25);
  --w-display: "Nunito", system-ui, sans-serif; --w-body: "Golos Text", system-ui, sans-serif;
}
.wheel-page[data-wheel="neon"] {
  color-scheme: dark;
  --w-bg: #05070a; --w-ink: #eef1f6; --w-muted: #8b94a4; --w-edge: #283040; --w-gold: #ffd25e;
  --w-cell: #0d1219; --w-cell2: #141a24; --w-card: #0b0f16; --w-track: #1a202a; --w-hair: rgba(255,255,255,0.05);
  --w-dim: #4a5262; --w-dim2: #9aa3b2; --w-soft: #c3c9d4; --w-on: #0a0c10; --w-shadow: rgba(0,0,0,.6);
  --w-display: "Russo One", "Arial Black", system-ui, sans-serif; --w-body: "Onest", system-ui, sans-serif;
}
html, body { height: 100%; }
body.wheel-page { margin: 0; }
.wheel-page { background: var(--w-bg); color: var(--w-ink); font-family: var(--w-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px; box-sizing: border-box; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; height: 100%; overflow: hidden; }
.wheel-page .site-bar { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.wheel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; min-height: 34px; }
h1 { font: 400 clamp(18px, 2.4vw, 24px)/1 var(--w-display); letter-spacing: .08em; text-transform: uppercase; margin: 0; }
p { margin: 0; color: var(--w-muted); font-size: 13px; }
button.back { font: 600 13px var(--w-body); color: var(--w-ink); background: var(--w-cell2); border: 1px solid var(--w-edge); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.back:focus-visible { outline: 2px solid var(--w-gold); outline-offset: 2px; }
.stage { position: relative; min-height: 0; overflow: hidden; }
.stage svg { position: absolute; top: 0; height: 100%; display: block; }
#w { left: 0; width: 100%; transition: width .7s cubic-bezier(.3, .7, .2, 1); }
#axis { left: 33%; width: 40%; transform: translateX(160%); opacity: 0; transition: transform .7s cubic-bezier(.3, .7, .2, 1), opacity .5s; }
.list {
  position: absolute; top: 0; right: 0; width: 27%; height: 100%; overflow-y: auto; box-sizing: border-box;
  padding: 0 4px 12px 14px; border-left: 1px solid var(--w-edge);
  transform: translateX(110%); opacity: 0; transition: transform .7s .12s cubic-bezier(.3, .7, .2, 1), opacity .5s .12s;
}
.stage.split #w { width: 33%; }
.stage.split #axis, .stage.split .list { transform: none; opacity: 1; }
.stage.human #w { width: 42%; }
.stage.human .list { transform: none; opacity: 1; width: 58%; padding-left: 22px; }
.crumbs { position: sticky; top: 0; z-index: 2; background: var(--w-bg); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 4px 0 8px; font-size: 13px; border-bottom: 1px solid var(--w-edge); }
.crumbs button { background: none; border: 0; color: var(--w-muted); font: 600 13px var(--w-body); padding: 2px 3px; cursor: pointer; border-radius: 4px; }
.crumbs button:hover, .crumbs button:focus-visible { color: var(--w-ink); outline: none; background: var(--w-cell2); }
.crumbs b { font-weight: 600; padding: 2px 3px; }
.crumbs .sep { color: var(--w-dim); }
.shead2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.shead2 b { font: 400 26px var(--w-display); font-variant-numeric: tabular-nums; }
.pbar { display: block; background: var(--w-track); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 3px; }
.split2 { display: grid; grid-template-columns: minmax(170px, 34%) 1fr; gap: 16px; margin-top: 10px; align-items: start; }
.tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tree button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 5px 8px; text-align: left; background: var(--w-cell); border: 1px solid var(--w-edge);
  border-radius: 7px; padding: 8px 10px; color: var(--w-ink); font: 600 13px var(--w-body); cursor: pointer; }
.tree button .pbar { grid-column: 1 / -1; }
.tree button .tpct { color: var(--w-muted); font-variant-numeric: tabular-nums; }
.tree button[aria-current="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--w-cell)); }
.tree button:hover, .tree button:focus-visible { border-color: var(--c); outline: none; }
.detail h3 { font: 400 18px var(--w-display); letter-spacing: .04em; margin: 0 0 10px; }
.essence { padding: 10px 0; border-bottom: 1px solid var(--w-hair); }
.erow { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: baseline; font-size: 15px; }
.erow .word { color: var(--w-muted); font-size: 12px; }
.essence.no .ename { color: var(--w-dim2); }
.essence .what { margin: 3px 0 0 28px; font-size: 13px; color: var(--w-soft); line-height: 1.4; }
.essence .an, .essence .chips { margin-left: 28px; }
.list h2 { font: 400 18px var(--w-display); letter-spacing: .06em; text-transform: uppercase; margin: 6px 0 4px; }
.list .sum { font-size: 12px; color: var(--w-muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.list table { width: 100%; border-collapse: collapse; font-size: 14px; }
.list th { text-align: left; font: 600 12px var(--w-body); color: var(--w-muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 0 4px; border-bottom: 1px solid var(--w-edge); }
.list td { padding: 5px 0; border-bottom: 1px solid var(--w-hair); }
.list td.st { width: 22px; font-size: 13px; }

.list .chip { font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  color: var(--w-ink); background: color-mix(in srgb, var(--c) 14%, var(--w-cell)); white-space: nowrap; }
.list button.chip { font-family: var(--w-body); cursor: pointer; }
.list button.chip:hover, .list button.chip:focus-visible { background: color-mix(in srgb, var(--c) 35%, var(--w-cell)); outline: none; }
.card {
  position: absolute; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); background: var(--w-card); border: 1px solid var(--w-edge);
  border-radius: 10px; padding: 14px 16px; box-shadow: 0 12px 40px var(--w-shadow); font-size: 14px; line-height: 1.45; z-index: 5;
}
.card h4 { font: 400 20px var(--w-display); margin: 0 26px 8px 0; }
.card .floor { font-size: 12px; color: var(--w-muted); margin: -4px 0 10px; }
.card .floor b { color: var(--w-ink); }
.tree .tfloor { display: block; font-weight: 400; font-size: 11px; color: var(--w-muted); margin-top: 2px; }
.card p { margin: 0 0 10px; color: var(--w-ink); font-size: 14px; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.card dt { color: var(--w-muted); }
.card dd { margin: 0; }
.card .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--w-muted); font-size: 22px; cursor: pointer; line-height: 1; }
.card .x:focus-visible { outline: 2px solid var(--w-gold); }
.list td.word { color: var(--w-muted); font-size: 12px; text-align: right; white-space: nowrap; }
.list tr.yes td { color: var(--w-ink); }
.list tr.no td:not(.word) { color: var(--w-dim2); }
#axis.swap { animation: swap .45s ease; }
@keyframes swap { from { opacity: .2; transform: translateX(6%); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .stage.split #w { width: 100%; transform: translateX(-100%); }

  #axis { left: 0; width: 100%; height: 55% !important; }
  .list { top: 55%; width: 100%; height: 45%; border-left: 0; border-top: 1px solid var(--w-edge); padding-left: 0; }
  .stage.human #w { width: 100%; transform: translateX(-100%); }
  .stage.human .list { top: 0; width: 100%; height: 100%; border-top: 0; padding-left: 0; }
  .split2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { #w, #axis, .list { transition: none; } #axis.swap { animation: none; } }
svg .axis { cursor: pointer; }
svg .axis:hover path, svg .axis:focus-visible path { filter: brightness(1.35); }
svg .axis:focus { outline: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--w-muted); }

svg text { pointer-events: none; }

.looks { display: flex; gap: 4px; }
.looks button { font: 600 12px var(--w-body); color: var(--w-muted); background: var(--w-cell2); border: 1px solid var(--w-edge); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.looks button[aria-pressed="true"] { color: var(--w-on); background: var(--w-gold); border-color: var(--w-gold); }
.looks button:focus-visible { outline: 2px solid var(--w-gold); outline-offset: 2px; }

  <svg id="w" viewBox="-490 -490 980 980" role="img" aria-label="Колесо мира"></svg>

<script src="WHEEL-DATA.js"></script>
<script>
const AXES_NEON = {
  "Число": [255, 210, 94], "Электричество": [100, 170, 255], "Радио": [70, 210, 255],
  "Пространство и время": [160, 230, 120], "Движение": [150, 160, 185], "Звук": [140, 240, 90], "Свет": [255, 110, 150]
};
const AXES_SITE = {
  "Число": [196, 140, 40], "Электричество": [47, 140, 160], "Радио": [70, 110, 190],
  "Пространство и время": [70, 140, 80], "Движение": [130, 110, 95], "Звук": [214, 105, 70], "Свет": [190, 75, 120]
};
const AXES = { ...AXES_NEON };
let T = {};
function applyTheme(look) {
  document.body.dataset.wheel = look;
  Object.assign(AXES, look === "neon" ? AXES_NEON : AXES_SITE);
  const v = n => getComputedStyle(document.body).getPropertyValue(n).trim();
  T = { bg: v("--w-bg"), ink: v("--w-ink"), cell: v("--w-cell"), dim: v("--w-dim"), dim2: v("--w-dim2"), on: v("--w-on"), gold: v("--w-gold"), display: v("--w-display"), body: v("--w-body") };
}

const HUMAN_PARENT = {};
const dataOf = name => INSIDE[name] || SECTORS_INSIDE[name] || {};
const colorOf = name => AXES[name] || AXES[HUMAN_PARENT[name]] || [200, 205, 215];
const NS = "http://www.w3.org/2000/svg", main = document.getElementById("w"), side = document.getElementById("axis"), stage = document.getElementById("stage");
let svg = main, current = null;
const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) if (a[k] !== null) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const pt = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];
function wedge(a0, a1, r0, r1) {
  const [x0, y0] = pt(a0, r1), [x1, y1] = pt(a1, r1), [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0), big = a1 - a0 > Math.PI ? 1 : 0;
  return `M${x0},${y0} A${r1},${r1} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${big} 0 ${x3},${y3} Z`;
}
const outline = () => ({ stroke: T.bg, "stroke-width": 4, "stroke-linejoin": "round", "paint-order": "stroke" });
function label(text, a, r, size, fill, font, parent = svg) {
  let deg = a * 180 / Math.PI + 90; const flip = Math.sin(a) > 0.05; if (flip) deg += 180;
  const [x, y] = pt(a, r), t = el("text", { x, y, transform: `rotate(${deg} ${x} ${y})`, "text-anchor": "middle", "dominant-baseline": "middle",
    fill, "font-size": size, "font-family": font, "letter-spacing": font === T.display ? 1.5 : 0, "font-weight": font === T.body ? 600 : 400, ...outline() }, parent);
  t.textContent = text;
}
function radial(text, a, r, size, fill, parent = svg) {
  const left = Math.cos(a) < 0, deg = a * 180 / Math.PI + (left ? 180 : 0), [x, y] = pt(a, r);
  const t = el("text", { x, y, transform: `rotate(${deg} ${x} ${y})`, "text-anchor": left ? "end" : "start", "dominant-baseline": "middle",
    fill, "font-size": size, "font-family": T.body, "font-weight": 600, ...outline() }, parent);
  t.textContent = text;
}
function hub(text, size, color = T.gold, ink = T.on, r = 106) {
  el("circle", { cx: 0, cy: 0, r, fill: color });
  const t = el("text", { x: 0, y: 2, "text-anchor": "middle", "dominant-baseline": "middle", fill: ink, "font-size": size, "font-family": T.display, "letter-spacing": 2 });
  t.textContent = text;
}

const title = document.getElementById("title"), lead = document.getElementById("lead"), back = document.getElementById("back"), legend = document.getElementById("legend");

function renderMain() {
  svg = main; svg.textContent = "";
  const R0 = 120, R1 = 300, R2 = 312, R3 = 470, step = 2 * Math.PI / HUMAN.length, base = -Math.PI / 2 - step / 2;
  const span = {};
  HUMAN.forEach(([, parents], i) => {
    const a0 = base + i * step, a1 = a0 + step, m = (a0 + a1) / 2;
    parents.forEach((p, k) => {
      let s = parents.length === 1 ? [a0, a1] : k === 0 ? [a0, m] : [m, a1];
      if (span[p] && s[0] - span[p][1] > Math.PI) s = [s[0] - 2 * Math.PI, s[1] - 2 * Math.PI];
      if (span[p] && span[p][0] - s[1] > Math.PI) s = [s[0] + 2 * Math.PI, s[1] + 2 * Math.PI];
      span[p] = span[p] ? [Math.min(span[p][0], s[0]), Math.max(span[p][1], s[1])] : s;
    });
  });
  Object.entries(span).forEach(([name, [a0, a1]]) => {
    const c = AXES[name], g = el("g", { class: "axis", tabindex: 0, role: "button", "aria-label": "Открыть ось " + name, "data-axis": name });
    el("path", { d: wedge(a0 + 0.012, a1 - 0.012, R0, R1), fill: rgb(c, 0.12), stroke: rgb(c), "stroke-width": 2.5 }, g);
    label(name.toUpperCase(), (a0 + a1) / 2, (R0 + R1) / 2 + 10, name.length > 12 ? 19 : 25, rgb(c), T.display, g);
    g.addEventListener("click", () => renderAxis(name));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); renderAxis(name); } });
  });
  HUMAN.forEach(([name, parents], i) => {
    const a0 = base + i * step + 0.01, a1 = base + (i + 1) * step - 0.01, m = (a0 + a1) / 2;
    const halves = parents.length === 1 ? [[a0, a1, AXES[parents[0]]]] : [[a0, m, AXES[parents[0]]], [m, a1, AXES[parents[1]]]];
    HUMAN_PARENT[name] = parents[0];
    const hg = el("g", { class: "axis hsec", tabindex: 0, role: "button", "aria-label": "Открыть сектор " + name, "data-h": name });
    const openIt = () => openSector(name);
    hg.addEventListener("click", openIt);
    hg.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openIt(); } });
    svg = hg;
    el("path", { d: wedge(a0, a1, R2, R3), fill: T.cell });
    halves.forEach(([h0, h1, c]) => { el("path", { d: wedge(h0, h1, R2, R3), fill: rgb(c, 0.1) }); el("path", { d: `M${pt(h0, R3)} A${R3},${R3} 0 0 1 ${pt(h1, R3)}`, fill: "none", stroke: rgb(c), "stroke-width": 2.5 }); el("path", { d: `M${pt(h0, R2)} A${R2},${R2} 0 0 1 ${pt(h1, R2)}`, fill: "none", stroke: rgb(c), "stroke-width": 2.5 }); });
    el("line", { x1: pt(a0, R2)[0], y1: pt(a0, R2)[1], x2: pt(a0, R3)[0], y2: pt(a0, R3)[1], stroke: rgb(halves[0][2]), "stroke-width": 2.5 });
    el("line", { x1: pt(a1, R2)[0], y1: pt(a1, R2)[1], x2: pt(a1, R3)[0], y2: pt(a1, R3)[1], stroke: rgb(halves[halves.length - 1][2]), "stroke-width": 2.5 });
    label(name, m, (R2 + R3) / 2, name.length > 12 ? 18 : 22, T.ink, T.body);
    svg = main;
  });
  hub("SALTIC", 30);
}

function renderAxis(name) {
  if (current === name) return;
  if (current && current.startsWith("h:")) current = null;
  const was = current; current = name;
  main.querySelectorAll(".axis").forEach(g => g.classList.toggle("on", g.dataset.axis === name));
  svg = side; svg.textContent = "";
  if (was) { side.classList.remove("swap"); void side.getBoundingClientRect(); side.classList.add("swap"); }
  stage.classList.remove("human"); stage.classList.add("split");
  title.textContent = "Колесо в колесе · " + name; lead.hidden = true; back.hidden = false; legend.hidden = false;
  const c = AXES[name], order = (DISCIPLINES[name] || []).flatMap(([, list]) => list);
  const subs = Object.entries(INSIDE[name]).sort(([x], [y]) => (order.indexOf(x) + 1 || 99) - (order.indexOf(y) + 1 || 99));
  const count = subs.reduce((s, [, items]) => s + items.length, 0), RD0 = 92, RD1 = 148, R0 = 154, R1 = 250, RI = 300;
  const at = {};
  let a = -Math.PI / 2;
  subs.forEach(([sub, items]) => {
    const span = 2 * Math.PI * items.length / count, a0 = a + 0.02, a1 = a + span - 0.02; a += span;
    at[sub] = [a0, a1];
    const g = el("g", { class: "axis sub", tabindex: 0, role: "button", "aria-label": "Показать подсектор " + sub, "data-sub": sub });
    el("path", { d: wedge(a0, a1, R0, R1), fill: rgb(c, 0.2), stroke: rgb(c, 0.85), "stroke-width": 2 }, g);
    label(sub, (a0 + a1) / 2, (R0 + R1) / 2, Math.max(12, Math.min(22, (a1 - a0) * (R0 + R1) / 2 / (sub.length * 0.58))), rgb(c), T.body, g);
    const pickSub = () => table(name, sub);
    g.addEventListener("click", pickSub);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickSub(); } });
    const got = items.reduce((s, x) => s + x[1], 0) / items.length;
    el("path", { d: wedge(a0, a1, R1 + 8, 270), fill: rgb(c, 0.12), stroke: rgb(c, 0.3), "stroke-width": 1 });
    if (got > 0) el("path", { d: wedge(a0, a0 + (a1 - a0) * got, R1 + 8, 270), fill: rgb(c) });
    items.forEach(([item, v], k) => {
      const ai = a0 + (a1 - a0) * (k + 0.5) / items.length, [x, y] = pt(ai, RI);
      el("line", { x1: pt(ai, 272)[0], y1: pt(ai, 272)[1], x2: x, y2: y, stroke: rgb(c, 0.35), "stroke-width": 1.5 });
      el("circle", { cx: x, cy: y, r: 11, fill: v >= 1 ? rgb(c) : T.cell, stroke: rgb(c, v > 0 ? 1 : 0.5), "stroke-width": 2.5 });
      if (v > 0 && v < 1) el("path", { d: `M${x},${y - 11} A11,11 0 0 1 ${x},${y + 11} Z`, fill: rgb(c) });
      radial(item, ai, RI + 20, 19, v >= 1 ? T.ink : v > 0 ? T.ink : T.dim2);
    });
  });
  (DISCIPLINES[name] || []).forEach(([disc, list]) => {
    const spans = list.filter(x => at[x]).map(x => at[x]);
    if (!spans.length) return;
    const d0 = Math.min(...spans.map(x => x[0])), d1 = Math.max(...spans.map(x => x[1]));
    const g = el("g", { class: "axis disc", tabindex: 0, role: "button", "aria-label": "Показать дисциплину " + disc, "data-disc": disc });
    el("path", { d: wedge(d0, d1, RD0, RD1), fill: rgb(c, 0.42), stroke: rgb(c), "stroke-width": 1.5 }, g);
    label(disc, (d0 + d1) / 2, (RD0 + RD1) / 2, Math.max(10, Math.min(17, (d1 - d0) * (RD0 + RD1) / 2 / (disc.length * 0.58))), T.ink, T.body, g);
    const pickDisc = () => table(name, null, disc);
    g.addEventListener("click", pickDisc);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickDisc(); } });
  });
  const all = subs.flatMap(([, items]) => items), share = Math.round(all.reduce((s, x) => s + x[1], 0) / all.length * 100);
  const core = el("g", { class: "axis", tabindex: 0, role: "button", "aria-label": "Показать всю ось " + name });
  el("circle", { cx: 0, cy: 0, r: 86, fill: rgb(c) }, core);
  core.addEventListener("click", () => table(name));
  core.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); table(name); } });
  const lines = name.length > 12 ? ["ПРОСТРАНСТВО", "И ВРЕМЯ"] : [name.toUpperCase()], size = name.length > 12 ? 13 : 17;
  lines.forEach((ln, i) => { const t = el("text", { x: 0, y: -18 + (i - (lines.length - 1) / 2) * 16, "text-anchor": "middle", "dominant-baseline": "middle", fill: T.on, "font-size": size, "font-family": T.display, "letter-spacing": 1.5 }); t.textContent = ln; });
  const p = el("text", { x: 0, y: 22, "text-anchor": "middle", "dominant-baseline": "middle", fill: T.on, "font-size": 32, "font-family": T.display }); p.textContent = share + "%";
  table(name);
  svg = main;
}

function extras(text, c) {
  const [note, chips] = parse(text);
  const n = note ? `<div class="an">${note}</div>` : "";
  const pills = chips.length ? `<div class="chips">${chips.map(x => `<button type="button" class="chip" data-chip="${x}" style="--c:${rgb(c)}"${FLOOR[x] ? ` title="этаж ${FLOOR[x][0]} · ${FLOOR[x][1]}"` : ""}>${x}</button>`).join("")}</div>` : "";
  return n + pills;
}
function dossier(name, c) {
  const k = CAKE[name], o = OWN[name], box = document.getElementById("card");
  const st = k ? ({ done: "есть у нас", part: "частично", scout: "разведка" }[k.st] || "пока нет") : "";
  const rowsOf = (label, v) => v && (Array.isArray(v) ? v.length : true) ? `<dt>${label}</dt><dd>${Array.isArray(v) ? v.join(", ") : v}</dd>` : "";
  const floor = FLOOR[name] ? `<div class="floor">этаж пирога <b>${FLOOR[name][0]}</b> · ${FLOOR[name][1]}</div>` : `<div class="floor">в пироге пока нет</div>`;
  box.innerHTML = `<button type="button" class="x" aria-label="Закрыть досье">×</button><h4 style="color:${rgb(c)}">${name}</h4>${floor}` + (k
    ? `<p>${k.what}</p><dl>${rowsOf("стоит на", k.on)}${rowsOf("с чем работает", k.with)}${rowsOf("где живёт", k.where)}${rowsOf("у нас", k.us || st)}</dl>`
    : o ? `<p>${o[0]}</p><dl>${rowsOf("где живёт", o[1])}</dl>` : `<p>Досье пока не написано.</p>`);
  box.hidden = false;
  box.querySelector(".x").addEventListener("click", () => { box.hidden = true; if (crumbs.last) crumbs(...crumbs.last, null); });
}
const discOf = (name, sub) => ((DISCIPLINES[name] || []).find(([, list]) => list.includes(sub)) || [null])[0];
function crumbs(name, disc, sub, chip) {
  const isAxis = !!AXES[name];
  const c = rgb(colorOf(name)), steps = [["Колесо", () => closeAxis()], [name, () => isAxis ? table(name) : sectorPanel(name)]];
  if (disc) steps.push([disc, () => table(name, null, disc)]);
  if (sub) steps.push([sub, () => isAxis ? table(name, sub) : sectorPanel(name, sub)]);
  if (chip) steps.push([chip, null]);
  const nav = document.getElementById("crumbs");
  nav.innerHTML = steps.map(([t, go], i) => (i ? '<span class="sep">›</span>' : "") +
    (go && i < steps.length - 1 ? `<button type="button" data-i="${i}">${t}</button>` : `<b style="color:${c}">${t}</b>`)).join("");
  nav.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => steps[+btn.dataset.i][1]()));
  crumbs.last = [name, disc, sub];
}
function table(name, only, disc) {
  disc = disc || (only ? discOf(name, only) : null);
  const inDisc = disc ? ((DISCIPLINES[name] || []).find(([d]) => d === disc) || [, []])[1] : null;
  side.querySelectorAll(".sub").forEach(g => g.classList.toggle("on", only ? g.dataset.sub === only : !!inDisc && inDisc.includes(g.dataset.sub)));
  side.querySelectorAll(".disc").forEach(g => g.classList.toggle("on", !only && g.dataset.disc === disc));
  const box = document.getElementById("list"), order = (DISCIPLINES[name] || []).flatMap(([, list]) => list);
  const subs = Object.entries(dataOf(name)).filter(([sub]) => only ? sub === only : inDisc ? inDisc.includes(sub) : true)
    .sort(([x], [y]) => (order.indexOf(x) + 1 || 99) - (order.indexOf(y) + 1 || 99));
  const all = subs.flatMap(([, items]) => items), have = all.filter(x => x[1] >= 1).length, half = all.filter(x => x[1] > 0 && x[1] < 1).length;
  if (!all.length) {
    box.innerHTML = `<nav class="crumbs" id="crumbs" aria-label="Где ты"></nav><h2 style="color:${rgb(colorOf(name))}">${name}</h2><div class="sum">сектор ещё не разложен на сути</div>`;
    crumbs(name, null, null, null); document.getElementById("card").hidden = true; return;
  }
  const word = v => v >= 1 ? "есть" : v > 0 ? "начато" : "нет";
  const mark = v => v >= 1 ? "●" : v > 0 ? "◐" : "○";
  box.innerHTML = `<nav class="crumbs" id="crumbs" aria-label="Где ты"></nav><h2 style="color:${rgb(colorOf(name))}">${only || disc || name}</h2><div class="sum">всего ${all.length} · есть ${have} · начато ${half} · нет ${all.length - have - half}</div><table>` +
    subs.map(([sub, items]) => `<tr><th colspan="3">${sub}</th></tr>` + items.map(([item, v, an]) =>
      `<tr class="${v > 0 ? "yes" : "no"}"><td class="st" style="color:${v > 0 ? rgb(colorOf(name)) : T.dim}">${mark(v)}</td><td>${item}${an ? extras(an, colorOf(name)) : ""}</td><td class="word">${word(v)}</td></tr>`).join("")).join("") + "</table>";
  box.scrollTop = 0;
  crumbs(name, disc, only, null);
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { dossier(b.dataset.chip, colorOf(name)); crumbs(name, disc, only, b.dataset.chip); }));
  document.getElementById("card").hidden = true;
}
function openSector(name) {
  current = "h:" + name;
  main.querySelectorAll(".axis").forEach(g => g.classList.toggle("on", g.dataset.h === name));
  stage.classList.remove("split"); stage.classList.add("human");
  title.textContent = "Колесо в колесе · " + name; lead.hidden = true; back.hidden = false; legend.hidden = false;
  sectorPanel(name);
}
// Сектор: слева дерево подсекторов с прогрессом, справа выбранный подсектор
function sectorPanel(name, pick) {
  const box = document.getElementById("list"), c = colorOf(name), data = Object.entries(dataOf(name));
  if (!data.length) return table(name);
  const score = items => items.reduce((s, x) => s + x[1], 0) / items.length;
  const all = data.flatMap(([, items]) => items), total = Math.round(score(all) * 100);
  const sub = pick && dataOf(name)[pick] ? pick : data[0][0], items = dataOf(name)[sub];
  const word = v => v >= 1 ? "есть" : v > 0 ? "начато" : "нет", mark = v => v >= 1 ? "●" : v > 0 ? "◐" : "○";
  const floors = list => [...new Set(list.flatMap(([, , an]) => an ? parse(an)[1] : []).filter(x => FLOOR[x]).map(x => FLOOR[x][0]))].sort((x, y) => x - y);
  const floorTag = list => { const f = floors(list); return f.length ? `<span class="tfloor">эт. ${f.join(", ")}</span>` : ""; };
  const bar = (v, h) => `<span class="pbar" style="height:${h}px"><i style="width:${Math.round(v * 100)}%;background:${rgb(c)}"></i></span>`;
  box.innerHTML = `<nav class="crumbs" id="crumbs" aria-label="Где ты"></nav>
    <div class="shead2"><h2 style="color:${rgb(c)}">${name}</h2><b style="color:${rgb(c)}">${total}%</b></div>${bar(score(all), 6)}
    <div class="sum">всего ${all.length} · есть ${all.filter(x => x[1] >= 1).length} · начато ${all.filter(x => x[1] > 0 && x[1] < 1).length}</div>
    <div class="split2"><ul class="tree">${data.map(([t, list]) => `<li><button type="button" data-sub="${t}" aria-current="${t === sub}" style="--c:${rgb(c)}">
      <span class="tname">${t}${floorTag(list)}</span><span class="tpct">${Math.round(score(list) * 100)}%</span>${bar(score(list), 4)}</button></li>`).join("")}</ul>
    <div class="detail"><h3 style="color:${rgb(c)}">${sub}</h3>${items.map(([item, v, an, what]) => `<div class="essence ${v > 0 ? "yes" : "no"}">
      <div class="erow"><span class="st" style="color:${v > 0 ? rgb(c) : T.dim}">${mark(v)}</span><span class="ename">${item}</span><span class="word">${word(v)}</span></div>
      ${what ? `<div class="what">${what}</div>` : ""}${an ? extras(an, c) : ""}</div>`).join("")}</div></div>`;
  box.scrollTop = 0;
  crumbs(name, null, sub, null);
  box.querySelectorAll(".tree button").forEach(b => b.addEventListener("click", () => sectorPanel(name, b.dataset.sub)));
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { dossier(b.dataset.chip, c); crumbs(name, null, sub, b.dataset.chip); }));
  document.getElementById("card").hidden = true;
}
function closeAxis() {
  current = null; stage.classList.remove("split", "human");
  main.querySelectorAll(".axis").forEach(g => g.classList.remove("on"));
  title.textContent = "Колесо в колесе"; lead.hidden = false; back.hidden = true; legend.hidden = true;
}

back.addEventListener("click", closeAxis);
addEventListener("keydown", e => { if (e.key === "Escape" && current) closeAxis(); });
let look = "site";
try { look = localStorage.getItem("saltic-wheel-look") || "site"; } catch (e) {}
function setLook(next) {
  look = next;
  try { localStorage.setItem("saltic-wheel-look", next); } catch (e) {}
  document.querySelectorAll(".looks button").forEach(b => b.setAttribute("aria-pressed", b.dataset.look === next));
  applyTheme(next);
  const open = current; renderMain();
  if (open && open.startsWith("h:")) { current = null; openSector(open.slice(2)); }
  else if (open) { current = null; renderAxis(open); }
}
document.querySelectorAll(".looks button").forEach(b => b.addEventListener("click", () => setLook(b.dataset.look)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => look === "site" && setLook("site"));
setLook(look);

</script>
