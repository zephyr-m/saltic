<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saltic Playground</title>
    <style>
        :root { color-scheme: light; --ink:#29251f; --muted:#81796f; --panel:#fffdf8; --line:#d9d1c5; --hot:#f2b705; --cold:#087ea4; --bad:#c9364f; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:#f4efe6; color:var(--ink); font:15px/1.5 ui-monospace, "Cascadia Code", monospace; }
        main { width:min(1180px, 100%); min-height:100vh; margin:auto; padding:24px; display:grid; grid-template-rows:auto 1fr; gap:16px; }
        header, .toolbar, .status { display:flex; align-items:center; gap:12px; }
        header { justify-content:space-between; }
        h1 { margin:0; font-size:18px; letter-spacing:.03em; }
        h1 span { color:var(--hot); }
        .hint { color:var(--muted); font-size:12px; }
        .workspace { min-height:0; display:grid; grid-template-columns:1.15fr .85fr; gap:12px; }
        .pane { min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--panel); display:grid; grid-template-rows:auto 1fr; }
        .toolbar { min-height:52px; padding:8px 10px; border-bottom:1px solid var(--line); }
        .toolbar strong { margin-right:auto; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
        button, select { border:1px solid var(--line); border-radius:9px; background:#f8f3ea; color:var(--ink); font:inherit; padding:7px 10px; }
        button { cursor:pointer; }
        button:hover, select:hover { border-color:#a79d90; background:#fffaf1; }
        button.run { background:var(--hot); border-color:#dca600; color:#251d04; font-weight:800; }
        button:disabled { cursor:wait; opacity:.55; }
        .source, .output { width:100%; height:100%; min-height:540px; margin:0; border:0; outline:0; resize:none; background:transparent; color:var(--ink); font:14px/1.65 ui-monospace, "Cascadia Code", monospace; tab-size:4; }
        .source { padding:18px; caret-color:var(--hot); }
        .output { padding:18px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; color:#494239; }
        .status { color:var(--muted); font-size:12px; }
        .status.ok { color:var(--cold); }
        .status.bad { color:var(--bad); }
        .spinner { display:none; width:13px; height:13px; border:2px solid #d6cec2; border-top-color:#9b7200; border-radius:50%; animation:spin .7s linear infinite; }
        .running .spinner { display:block; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @media (max-width:800px) { main { padding:12px; } .workspace { grid-template-columns:1fr; } .source, .output { min-height:42vh; } .hint { display:none; } }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/real.js"></script>
<script>
fetch("/app.jtml")
    .then(response => response.json())
    .then(jtml => ReaL.render(document.querySelector("#app"), jtml))
    .catch(error => { document.querySelector("#app").textContent = error.message })

document.addEventListener("keydown", event => {
    if (event.target.matches("textarea.source") && event.key === "Tab") {
        event.preventDefault()
        event.target.setRangeText("    ", event.target.selectionStart, event.target.selectionEnd, "end")
    }
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        document.querySelector("#run")?.click()
    }
})
</script>
</body>
</html>
